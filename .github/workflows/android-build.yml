name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      # 🚨 THE SCRAMBLING MACHINE 🚨
      # This runs before Capacitor grabs the files, ensuring the APK only gets the gibberish.
      # IMPORTANT: Change "./www" to whatever folder contains your HTML/JS (e.g., ./public, ./dist, or ./build)
      - name: Scramble CBT Logic
        run: npx javascript-obfuscator ./www --output ./www --self-defending true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScholarsPrep-Final-Shell
          path: android/app/build/outputs/apk/debug/app-debug.apk