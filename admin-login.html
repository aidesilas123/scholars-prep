<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal - Login</title>
  <link rel="icon" type="image" href="favicon1.png">
  <style>
    body {
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #021a02, #063b08);
      color: white;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-header h1 { margin: 0; font-size: 24px; color: #4CAF50; }
    .login-header p { margin-top: 10px; color: #aaa; font-size: 14px; }

    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-size: 13px; color: #ccc; }
    .form-group input {
      width: 100%; padding: 12px 15px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: white; font-size: 16px;
      box-sizing: border-box; outline: none;
    }
    .form-group input:focus { border-color: #4CAF50; }

    .btn-login {
      width: 100%; padding: 14px;
      background: #4CAF50; color: white;
      border: none; border-radius: 8px;
      font-size: 16px; font-weight: bold;
      cursor: pointer; transition: background 0.3s;
    }
    .btn-login:hover { background: #43a047; }
    .btn-login:disabled { background: #2e5e30; cursor: not-allowed; }

    .error-msg {
      background: rgba(255, 75, 92, 0.1);
      border: 1px solid #ff4b5c; color: #ff4b5c;
      padding: 12px; border-radius: 8px;
      margin-bottom: 20px; font-size: 14px;
      display: none; text-align: center;
    }
    
    .back-link {
        display: block; text-align: center; margin-top: 20px;
        color: #888; text-decoration: none; font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <h1>Admin Portal</h1>
      <p>Authorized Personnel Only</p>
    </div>

    <div id="errorBox" class="error-msg"></div>

    <form id="adminLoginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="admin@example.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <button type="submit" id="loginBtn" class="btn-login">Log In</button>
    </form>
    
    <a href="index.html" class="back-link">Return to User Login</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
    const SUPABASE_URL = 'https://xtmoolyxxylylttugjek.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0bW9vbHl4eHlseWx0dHVnamVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTU4NjE2MjAsImV4cCI6MjA3MTQzNzYyMH0.SKUKEPBGmKKeBlTvmJkcL2CNREfbyyLe61v-XhOIPtI';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const loginForm = document.getElementById('adminLoginForm');
    const errorBox = document.getElementById('errorBox');
    const loginBtn = document.getElementById('loginBtn');

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        showError(null);
        setLoading(true);

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        try {
            // 1. Check credentials against admin_users table
            const { data, error } = await supabaseClient
                .from('admin_users')
                .select('*')
                .eq('email', email)
                .eq('password', password) // Direct string match (Note: In production use hashing)
                .single();

            if (error || !data) {
                throw new Error("Invalid admin credentials");
            }

            // 2. Save session to a UNIQUE key (completely separate from users)
            const adminSession = {
                id: data.id,
                email: data.email,
                role: 'admin',
                loginTime: Date.now()
            };
            
            // KEY CHANGE: Using 'abupq_admin_session' instead of 'abupq_logged_in_user'
            localStorage.setItem('abupq_admin_session', JSON.stringify(adminSession));

            // 3. Redirect
            window.location.href = 'admin-dashboard.html';

        } catch (error) {
            console.error(error);
            showError("Access Denied: Invalid email or password");
        } finally {
            setLoading(false);
        }
    });

    function showError(msg) {
        if (msg) {
            errorBox.style.display = 'block';
            errorBox.textContent = msg;
        } else {
            errorBox.style.display = 'none';
        }
    }

    function setLoading(isLoading) {
        if (isLoading) {
            loginBtn.disabled = true;
            loginBtn.textContent = 'Verifying...';
        } else {
            loginBtn.disabled = false;
            loginBtn.textContent = 'Log In';
        }
    }
  </script>
</body>
</html>
