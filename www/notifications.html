<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - Scholars Prep</title>
  <link rel="icon" type="image" href="favicon1.png">
  <style id="iron-cloak">
    html, body { display: none !important; visibility: hidden !important; opacity: 0 !important; }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    (function() {
        const _sb = supabase.createClient('https://xtmoolyxxylylttugjek.supabase.co', 'sb_publishable_Z-w3oC1ZID4SCOnfnFuAjw_CDow4UHG');

        async function strictGuard() {
            const ua = navigator.userAgent.toLowerCase();
            const platform = navigator.platform.toLowerCase();
            
            // 🛡️ THE TRIPLE THREAT CHECK
            const isMobileOS = /android|iphone|ipad|ipod/.test(ua);
            const isApp = ua.includes('wv') || window.Capacitor;
            const hasTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
            
            // Strictly block if it smells like a PC (Windows, Mac, Linux)
            const isPC = /win|mac|linux/.test(platform);

            // 1. Instant Desktop Kick (No DB wait)
            if (isPC && !isApp) {
                window.location.replace('index.html');
                return;
            }

            // 2. Database Check
            const { data } = await _sb.from('site_settings').select('mobile_only_mode').eq('id', 1).single();

            // Logic: If mobile mode is ON, only allow REAL mobile devices
            if (data && data.mobile_only_mode) {
                if (isMobileOS || isApp || (hasTouch && !isPC)) {
                    // VALID MOBILE: Unlock the page
                    unlock();
                } else {
                    // BYPASS ATTEMPT: Kick to index
                    window.location.replace('index.html');
                }
            } else {
                // MAINTENANCE OFF: Unlock for everyone
                unlock();
            }
        }

        function unlock() {
            const cloak = document.getElementById('iron-cloak');
            if (cloak) cloak.remove();
            document.documentElement.style.display = 'block';
        }

        strictGuard();
    })();
</script>

  <style>
    :root {
      --primary: #063b08;
      --secondary: #083502;
      --accent: #4CAF50;
      --glass: rgba(255, 255, 255, 0.05);
      --card-bg: rgba(255, 255, 255, 0.1);
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 15px;
    }

    .header h1 { margin: 0; font-size: 24px; }

    .back-btn {
      background: var(--accent);
      color: white;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
    }

    .notif-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .notif-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      position: relative;
      border-left: 4px solid transparent;
      transition: transform 0.2s;
    }

    /* Style for unread messages */
    .notif-card.unread {
      background: rgba(255, 255, 255, 0.15);
      border-left: 4px solid var(--accent);
    }

    .notif-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .notif-title {
      font-weight: bold;
      font-size: 18px;
      color: var(--accent);
    }

    .notif-time {
      font-size: 12px;
      opacity: 0.7;
    }

    .notif-body {
      font-size: 15px;
      line-height: 1.5;
      opacity: 0.9;
      white-space: pre-wrap; /* Keeps line breaks */
    }

    .empty-state {
      text-align: center;
      padding: 50px;
      color: rgba(255,255,255,0.5);
    }

    .badge-new {
      background: #ff4b5c;
      color: white;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 8px;
      vertical-align: middle;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🔔 Notifications</h1>
    <a href="dashboard.html" class="back-btn">← Dashboard</a>
  </div>

  <div id="loading" style="text-align:center; padding:20px;">Loading updates...</div>
  <div id="notifList" class="notif-list"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="notifications.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js');
    });
  }
</script>
 
</body>
</html>
