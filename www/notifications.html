<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f8fafc" id="theme-color-meta" />
  <title>Notifications — Scholars Prep</title>
  <link rel="icon" type="image" href="favicon1.png">
  
  <!-- DYNAMIC ANTI-FLASH SCRIPT -->
  <script>
    const savedTheme = localStorage.getItem('sp_theme');
    const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
      document.documentElement.classList.add('dark');
      document.documentElement.style.backgroundColor = '#121212';
    } else {
      document.documentElement.style.backgroundColor = '#f8fafc';
    }
  </script>

  <script defer type="module" src="assets/ionic-core/dist/ionic/ionic.esm.js"></script>
  <script defer nomodule src="assets/ionic-core/dist/ionic/ionic.js"></script>
  <link rel="stylesheet" href="assets/ionic-core/css/ionic.bundle.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --ion-color-primary: #044908;
      --panel: #ffffff;
      --muted: #8f96a3;
      --page-bg: #f8fafc;
      --table-border: rgba(128,128,128,0.2);
    }
    header {
  padding-top: env(safe-area-inset-top);
}

    html.dark, html.dark body.dark {
      --ion-background-color: #121212; 
      --ion-text-color: #ffffff; 
      --panel: #1e1e1e;
      --page-bg: #121212;
      --table-border: rgba(255,255,255,0.1);
      background-color: #121212 !important;
    }

    body { background: var(--page-bg) !important; font-family: Inter, sans-serif; height: 100%; margin: 0; overscroll-behavior-y: none; }
    
    ion-app.hydrated { visibility: visible; opacity: 1; transition: opacity 0.3s ease; }
    
    /* Linear Navigation Stack Animations */
    .view-layer { display: none; height: 100%; width: 100%; flex-direction: column; }
    .view-layer.active { display: flex; animation: slideInRight 0.3s cubic-bezier(0.25, 0.8, 0.25, 1) forwards; }
    @keyframes slideInRight { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }

    /* Alert List Card */
    .alert-card {
        background: var(--panel); border: 1.5px solid var(--ion-color-primary);
        border-radius: 12px; padding: 16px; margin-bottom: 12px;
        display: flex; gap: 15px; align-items: center;
        box-shadow: 0 4px 6px rgba(0,0,0,0.02); cursor: pointer;
        transition: transform 0.2s;
    }
    .alert-card:active { transform: scale(0.98); }
    
    .alert-icon-box {
        background: rgba(4, 73, 8, 0.1); color: var(--ion-color-primary);
        width: 45px; height: 45px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center; font-size: 24px;
        flex-shrink: 0;
    }

    .alert-content { flex: 1; overflow: hidden; }
    .alert-title { font-weight: bold; font-size: 16px; margin: 0 0 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ion-text-color); }
    .alert-preview { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .alert-time { font-size: 11px; color: var(--muted); margin-top: 6px; display: block; font-weight: 600; }

    /* Detail View Styling */
    .detail-card {
        background: var(--panel); border: 1.5px solid var(--ion-color-primary);
        border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        margin-top: 10px;
    }
    .detail-date { color: var(--ion-color-primary); font-size: 13px; font-weight: bold; margin-bottom: 10px; display: block; }
    .detail-title { font-size: 22px; font-weight: 800; margin: 0 0 20px 0; line-height: 1.3; color: var(--ion-text-color); }
    .detail-message { color: var(--ion-text-color); line-height: 1.7; font-size: 15px; }
  </style>
</head>
<body class="noselect">
  <ion-app>
    
    <!-- VIEW 1: NOTIFICATION LIST -->
    <div id="view-list" class="view-layer active">
      <ion-header class="ion-no-border" style="background: var(--page-bg);">
        <ion-toolbar style="--background: transparent; padding-top: 5px;">
          <ion-buttons slot="start">
            <ion-button color="primary" onclick="window.location.replace('dashboard.html')"><ion-icon name="arrow-back-outline" style="font-size: 24px;"></ion-icon></ion-button>
          </ion-buttons>
          <ion-title style="font-weight: 800; font-size: 16px; color: var(--ion-text-color);">Notifications</ion-title>
        </ion-toolbar>
      </ion-header>
      
      <ion-content class="ion-padding" style="--background: var(--page-bg);">
        <div id="alertSkeleton">
            <ion-skeleton-text animated style="height: 80px; border-radius: 12px; margin-bottom: 12px;"></ion-skeleton-text>
            <ion-skeleton-text animated style="height: 80px; border-radius: 12px; margin-bottom: 12px;"></ion-skeleton-text>
            <ion-skeleton-text animated style="height: 80px; border-radius: 12px; margin-bottom: 12px;"></ion-skeleton-text>
        </div>
        
        <div id="emptyState" style="display: none; text-align: center; padding-top: 60px; color: var(--muted);">
            <ion-icon name="notifications-off-outline" style="font-size: 72px; opacity: 0.3;"></ion-icon>
            <p style="margin-top: 16px; font-size: 16px;">No new notifications at the moment.</p>
        </div>

        <div id="alertListContainer"></div>
      </ion-content>
    </div>

    <!-- VIEW 2: NOTIFICATION DETAILS -->
    <div id="view-details" class="view-layer">
      <ion-header class="ion-no-border" style="background: var(--page-bg);">
        <ion-toolbar style="--background: transparent; padding-top: 5px;">
          <ion-buttons slot="start">
            <ion-button color="primary" onclick="history.back()"><ion-icon name="arrow-back-outline" style="font-size: 24px;"></ion-icon></ion-button>
          </ion-buttons>
          <ion-title style="font-weight: 800; font-size: 16px; color: var(--ion-text-color);">Message</ion-title>
        </ion-toolbar>
      </ion-header>
      
      <ion-content class="ion-padding" style="--background: var(--page-bg);">
        <div class="detail-card">
            <span class="detail-date" id="detailDate">Loading...</span>
            <h1 class="detail-title" id="detailTitle">Loading...</h1>
            <div class="detail-message" id="detailMessage"></div>
        </div>
      </ion-content>
    </div>

  </ion-app>

  <script defer src="notifications.js"></script>
  
</body>
</html>
