<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard - Scholars Prep</title>
  <link rel="icon" type="image" href="favicon1.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    (function() {
        const _sb = supabase.createClient('https://xtmoolyxxylylttugjek.supabase.co', 'sb_publishable_Z-w3oC1ZID4SCOnfnFuAjw_CDow4UHG');

        async function strictGuard() {
            const ua = navigator.userAgent.toLowerCase();
            const platform = navigator.platform.toLowerCase();
            
            // 🛡️ THE TRIPLE THREAT CHECK
            const isMobileOS = /android|iphone|ipad|ipod/.test(ua);
            const isApp = ua.includes('wv') || window.Capacitor;
            const hasTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
            
            // Strictly block if it smells like a PC (Windows, Mac, Linux)
            const isPC = /win|mac|linux/.test(platform);

            // 1. Instant Desktop Kick (No DB wait)
            if (isPC && !isApp) {
                window.location.replace('/');
                return;
            }

            // 2. Database Check
            const { data } = await _sb.from('site_settings').select('mobile_only_mode').eq('id', 1).single();

            // Logic: If mobile mode is ON, only allow REAL mobile devices
            if (data && data.mobile_only_mode) {
                if (isMobileOS || isApp || (hasTouch && !isPC)) {
                    // VALID MOBILE: Unlock the page
                    unlock();
                } else {
                    // BYPASS ATTEMPT: Kick to index
                    window.location.replace('/');
                }
            } else {
                // MAINTENANCE OFF: Unlock for everyone
                unlock();
            }
        }

        
    })();
</script>
  
  <style>
    /* Mobile Table Styles */
    @media (max-width: 768px) {
      .scores-table thead { display: none; }
      .scores-table tbody tr {
        display: block;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px; margin-bottom: 12px; padding: 12px;
      }
      .scores-table tbody td {
        display: flex; justify-content: space-between; align-items: center;
        padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
        text-align: right;
      }
      .scores-table tbody td:last-child { border-bottom: none; }
      
      /* Only show labels on mobile */
      .scores-table tbody td::before {
        content: attr(data-label);
        font-weight: 700; color: var(--muted); margin-right: 10px;
      }
    }
    /* Global Styles */
    :root {
      --grad: linear-gradient(135deg, #051f01, #063b08);
      --card: rgba(14, 224, 28, 0.12);
      --panel: rgba(121, 22, 22, 0.18);
      --text: #eef2ff;
      --muted: #cbd5e1;
      --accent: #3f66ff;
      --accent-dark: #2f4ed7;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--grad); color: var(--text);
      min-height: 100vh; -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }

    /* --- MOBILE RESPONSIVE TABLE CSS --- */
    @media screen and (max-width: 768px) {
      .scores-table thead { display: none; }
      .scores-table tbody tr {
        display: block;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px; margin-bottom: 15px; padding: 10px;
      }
      .scores-table tbody td {
        display: flex; justify-content: space-between; align-items: center;
        padding: 10px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        text-align: right; font-size: 0.95rem;
      }
      .scores-table tbody td:last-child { border-bottom: none; }

      /* Labels for Mobile */
      .scores-table td:nth-of-type(1)::before { content: "Rank"; font-weight: bold; color: var(--muted); }
      .scores-table td:nth-of-type(2)::before { content: "Student"; font-weight: bold; color: var(--muted); }
      .scores-table td:nth-of-type(3)::before { content: "GPA"; font-weight: bold; color: var(--muted); }
      .scores-table td:nth-of-type(4)::before { content: "Score"; font-weight: bold; color: var(--muted); }
      .scores-table td:nth-of-type(5)::before { content: "Date"; font-weight: bold; color: var(--muted); }

      /* Special styling for Rank/Avatar row on mobile */
      .scores-table tbody td:nth-of-type(2) {
        justify-content: flex-end; /* Align user info to right */
      }
    }

    /* Regular Styles */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; height: 64px;
      z-index: 9999; display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; background: rgba(6, 59, 8, 0.95);
      backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .brand { font-weight: 800; font-size: 18px; color: #fff; cursor: pointer; }
    .btn-back {
      background: rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 20px;
      font-size: 14px; font-weight: 600; transition: 0.2s;
    }

    .main-content {
      margin-top: 80px; padding: 20px; max-width: 1000px; margin-left: auto; margin-right: auto;
    }

    .header-card {
      text-align: center; margin-bottom: 30px;
      padding: 30px 20px; background: var(--panel); border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,0.1);
    }
    h1 {
      background: linear-gradient(135deg, #4CAF50, #81c784);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      font-size: 2rem; margin-bottom: 10px;
    }

    /* Podium */
    .podium-section {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;
      margin-bottom: 40px; align-items: end;
    }
    @media (max-width: 600px) { .podium-section { grid-template-columns: 1fr; } }

    .podium-item {
      background: var(--card); border-radius: var(--radius); padding: 20px;
      text-align: center; position: relative; border: 2px solid transparent;
    }
    .podium-item.first { height: 260px; border-color: #FFD700; background: linear-gradient(145deg, #FFD700 0%, #B8860B 100%); order: 2; color: #000; }
    .podium-item.second { height: 230px; border-color: #C0C0C0; background: linear-gradient(145deg, #C0C0C0 0%, #808080 100%); order: 1; color: #000; }
    .podium-item.third { height: 200px; border-color: #CD7F32; background: linear-gradient(145deg, #CD7F32 0%, #8B4513 100%); order: 3; color: #000; }

    .rank-num { font-size: 40px; font-weight: 900; opacity: 0.5; }
    .podium-gpa { font-size: 32px; font-weight: 800; margin: 10px 0; }
    .podium-name { font-weight: 700; font-size: 18px; }

    /* Table */
    .scores-table {
      width: 100%; border-collapse: collapse; margin-top: 20px;
    }
    .scores-table th {
      text-align: left; padding: 15px; color: var(--muted); border-bottom: 1px solid rgba(255,255,255,0.2);
    }
    .scores-table td {
      padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .avatar-circle {
      width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,0.2);
      display: inline-flex; align-items: center; justify-content: center; margin-right: 10px;
      font-size: 12px; font-weight: bold;
    }
    .gpa-cell { color: #10b981; font-weight: bold; font-size: 1.1rem; }

    /* Refresh Btn */
    .refresh-btn {
      display: block; margin: 30px auto; padding: 12px 30px;
      background: var(--accent); color: white; border: none; border-radius: 10px;
      font-weight: bold; cursor: pointer;
    }

    .loading-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8);
      display: none; align-items: center; justify-content: center; z-index: 2000;
    }
    .spinner {
      width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3);
      border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="loading-overlay" id="loader">
    <div class="spinner"></div>
  </div>

  <header class="topbar">
    <div class="brand" onclick="location.href='dashboard.html'">🏆 Scholars Prep</div>
    <a href="dashboard.html" class="btn-back">Dashboard</a>
  </header>

  <div class="main-content">
    <div class="header-card">
      <h1>Top Scholars</h1>
      <p style="color: var(--muted)">Ranking by highest GPA achieved.</p>
    </div>

    <div class="podium-section" id="podium">
      </div>

    <div style="background: rgba(255,255,255,0.05); padding: 20px; border-radius: 16px;">
      <h3 style="margin-bottom: 15px;">All High Scores</h3>
      <table class="scores-table">
        <thead>
          <tr>
            <th width="10%">Rank</th>
            <th width="40%">Student</th>
            <th width="20%">GPA</th>
            <th width="15%">Score</th>
            <th width="15%">Date</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          </tbody>
      </table>
    </div>

    <button class="refresh-btn" onclick="loadLeaderboard()">Refresh Board</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="leaderboard.js"></script>
  
</body>
</html>
