<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f8fafc" id="theme-color-meta" />
  <title>Leaderboard — Scholars Prep</title>
  <link rel="icon" type="image" href="favicon1.png">
  
  <script>
    const savedTheme = localStorage.getItem('sp_theme');
    const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
      document.documentElement.classList.add('dark');
      document.documentElement.style.backgroundColor = '#121212';
    } else {
      document.documentElement.style.backgroundColor = '#f8fafc';
    }
  </script>

  <script defer type="module" src="assets/ionic-core/dist/ionic/ionic.esm.js"></script>
  <script defer nomodule src="assets/ionic-core/dist/ionic/ionic.js"></script>
  <link rel="stylesheet" href="assets/ionic-core/css/ionic.bundle.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --ion-color-primary: #044908;
      --panel: #ffffff;
      --muted: #8f96a3;
      --page-bg: #f8fafc;
      --table-header: rgba(4,73,8,0.1);
      --table-border: rgba(128,128,128,0.2);
    }
    header {
  padding-top: max(env(safe-area-inset-top), 10px);
}

    html.dark, html.dark body.dark {
      --ion-background-color: #121212; 
      --ion-text-color: #ffffff; 
      --panel: #1e1e1e;
      --page-bg: #121212;
      --table-header: rgba(255,255,255,0.05);
      --table-border: rgba(255,255,255,0.1);
      background-color: #121212 !important;
    }

    body { background: var(--page-bg) !important; font-family: Inter, sans-serif; height: 100%; margin: 0; overscroll-behavior-y: none; }
    
    ion-app.hydrated { visibility: visible; opacity: 1; transition: opacity 0.3s ease; }
    
    /* Navigation Animations */
    .view-layer { display: none; height: 100%; width: 100%; flex-direction: column; }
    .view-layer.active { display: flex; animation: slideInRight 0.3s cubic-bezier(0.25, 0.8, 0.25, 1) forwards; }
    @keyframes slideInRight { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }

    /* Leaderboard Cards */
    .rank-card {
        background: var(--panel); border: 1.5px solid var(--table-border);
        border-radius: 14px; padding: 12px 16px; margin-bottom: 12px;
        display: flex; align-items: center; justify-content: space-between;
        box-shadow: 0 4px 6px rgba(0,0,0,0.03); cursor: pointer; color: var(--ion-text-color);
        transition: transform 0.2s;
    }
    .rank-card:active { transform: scale(0.98); }
    
    /* Highlight the current user */
    .rank-card.is-me { border: 2px solid var(--ion-color-primary); background: rgba(4, 73, 8, 0.05); }

    .rank-left { display: flex; align-items: center; gap: 12px; }
    .rank-badge {
        width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; 
        justify-content: center; font-weight: bold; font-size: 14px; background: var(--page-bg); color: var(--muted);
    }
    
    /* Top 3 Colors */
    .rank-1 .rank-badge { background: #FFD700; color: #856404; box-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
    .rank-2 .rank-badge { background: #C0C0C0; color: #383d41; }
    .rank-3 .rank-badge { background: #CD7F32; color: #4a3014; }

    .avatar-circle {
        width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; 
        justify-content: center; font-size: 18px; font-weight: bold; color: white;
        background: linear-gradient(135deg, var(--ion-color-primary), #10b981);
    }

    .user-info { display: flex; flex-direction: column; }
    .user-name { font-weight: bold; font-size: 15px; color: var(--ion-text-color); margin: 0; }
    .user-tag { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .score-box { text-align: right; }
    .score-val { font-size: 18px; font-weight: 800; color: #10b981; }
    .score-total { font-size: 12px; color: var(--muted); }

    /* Transcript Detail View (Matches History Page) */
    .summary-charts { display: flex; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
    .chart-box { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .donut { 
        width: 140px; height: 140px; border-radius: 50%; 
        display: flex; justify-content: center; align-items: center; 
        background: conic-gradient(var(--ion-color-primary) 0%, #d1d5db 0);
        position: relative; box-shadow: inset 0 4px 10px rgba(0,0,0,0.1);
    }
    .donut::after { content: ''; position: absolute; width: 100px; height: 100px; background: var(--panel); border-radius: 50%; }
    .donut-text { position: absolute; z-index: 10; font-size: 24px; font-weight: bold; color: var(--ion-text-color); }
    
    .summary-table { width: 100%; border-collapse: collapse; margin-top: 20px; background: var(--panel); border-radius: 12px; overflow: hidden; border: 1.5px solid var(--table-border); color: var(--ion-text-color); }
    .summary-table th { background: var(--table-header); padding: 12px; font-weight: bold; text-align: center; border-bottom: 2px solid var(--table-border); color: var(--ion-color-primary); }
    .summary-table td { padding: 12px; text-align: center; border-bottom: 1px solid var(--table-border); font-weight: bold; }
    .summary-table tr:last-child td { border-bottom: none; }
    
    .text-green { color: #10b981; }
    .text-red { color: #ef4444; }
  </style>
</head>
<body class="noselect">
  <ion-app>
    
    <div id="view-list" class="view-layer active">
      <ion-header class="ion-no-border" style="background: var(--page-bg);">
        <ion-toolbar style="--background: transparent; padding-top: 5px;">
          <ion-buttons slot="start">
            <ion-button color="primary" onclick="history.back()"><ion-icon name="arrow-back-outline" style="font-size: 24px;"></ion-icon></ion-button>
          </ion-buttons>
          <ion-title style="font-weight: 800; font-size: 16px; color: var(--ion-text-color);">Top Undergrads</ion-title>
        </ion-toolbar>
      </ion-header>
      
      <ion-content class="ion-padding" style="--background: var(--page-bg);">
        
        <div style="text-align: center; margin-bottom: 20px;">
            <ion-icon name="trophy" style="font-size: 50px; color: #FFD700;"></ion-icon>
            <p style="color: var(--muted); margin-top: 5px; font-size: 14px;">Ranking based on highest overall GPA from Mock Sessions.</p>
        </div>

        <div id="leaderboardSkeleton">
            <ion-skeleton-text animated style="height: 70px; border-radius: 14px; margin-bottom: 12px;"></ion-skeleton-text>
            <ion-skeleton-text animated style="height: 70px; border-radius: 14px; margin-bottom: 12px;"></ion-skeleton-text>
            <ion-skeleton-text animated style="height: 70px; border-radius: 14px; margin-bottom: 12px;"></ion-skeleton-text>
        </div>
        
        <div id="emptyState" style="display: none; text-align: center; padding-top: 40px; color: var(--muted);">
            <ion-icon name="bar-chart-outline" style="font-size: 64px; opacity: 0.3;"></ion-icon>
            <p style="margin-top: 16px; font-size: 16px;">No exams have been completed yet.<br>Be the first to secure a spot!</p>
        </div>

        <div id="leaderboardContainer"></div>
        
      </ion-content>
    </div>

    <div id="view-details" class="view-layer">
      <ion-header class="ion-no-border" style="background: var(--page-bg);">
        <ion-toolbar style="--background: transparent; padding-top: 5px;">
          <ion-buttons slot="start">
            <ion-button color="primary" onclick="history.back()"><ion-icon name="arrow-back-outline" style="font-size: 24px;"></ion-icon></ion-button>
          </ion-buttons>
          <ion-title style="font-weight: 800; font-size: 16px; color: var(--ion-text-color);">Competitor Transcript</ion-title>
        </ion-toolbar>
      </ion-header>
      
      <ion-content class="ion-padding" style="--background: var(--page-bg);">
        
        <div style="text-align: center; margin-bottom: 20px;">
            <div class="avatar-circle" id="detailAvatar" style="margin: 0 auto; width: 60px; height: 60px; font-size: 24px;">?</div>
            <h2 id="detailName" style="margin: 10px 0 0; font-weight: bold; color: var(--ion-text-color);">Aspirant</h2>
        </div>

        <div class="summary-charts">
            <div class="chart-box">
                <div class="donut" id="gpaDonutChart">
                    <span class="donut-text" id="gpaDonutText">0.00</span>
                </div>
                <div style="font-weight: bold; color: var(--muted); margin-top: 8px;">Highest GPA</div>
            </div>
        </div>

        <h3 style="margin-top: 30px; border-bottom: 2px solid var(--table-border); padding-bottom: 8px; color: var(--ion-text-color);">Detail Breakdown</h3>
        <table class="summary-table">
            <thead>
                <tr>
                    <th style="text-align: left;">Course</th>
                    <th>Test</th>
                    <th>Exam</th>
                    <th>Total</th>
                    <th>Grade</th>
                </tr>
            </thead>
            <tbody id="detailsTableBody">
            </tbody>
        </table>

      </ion-content>
    </div>

  </ion-app>

  <script defer src="leaderboard.js"></script>
  
</body>
</html>
