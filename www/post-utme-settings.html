<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Settings — Scholars Prep</title>
  <link rel="icon" type="image" href="favicon1.png">
  
  <script defer type="module" src="assets/ionic-core/dist/ionic/ionic.esm.js"></script>
<script defer nomodule src="assets/ionic-core/dist/ionic/ionic.js"></script>
<link rel="stylesheet" href="assets/ionic-core/css/ionic.bundle.css" />

  <style>
    :root {
      --ion-color-primary: #044908;
      --panel: #ffffff;
      --muted: #8f96a3;
      --page-bg: #f3f4f6;
      --table-border: rgba(128,128,128,0.2);
    }
    header {
  padding-top: env(safe-area-inset-top);
}

    body.dark, body.dark-mode {
      --ion-background-color: #121212; 
      --ion-text-color: #ffffff; 
      --panel: #1e1e1e;
      --page-bg: #121212;
      --table-border: rgba(255,255,255,0.1);
    }

    body { background: var(--page-bg); font-family: Inter, sans-serif; }
    
    ion-app.hydrated { visibility: visible; opacity: 1; transition: opacity 0.3s ease; }
    
    /* Linear Navigation Stack Animations */
    .view-layer { display: none; height: 100%; width: 100%; flex-direction: column; }
    .view-layer.active { display: flex; animation: slideInRight 0.3s cubic-bezier(0.25, 0.8, 0.25, 1) forwards; }
    @keyframes slideInRight { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }

    /* Settings List Styling */
    .settings-group { background: var(--panel); border-radius: 16px; overflow: hidden; border: 1px solid var(--table-border); margin-bottom: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
    .settings-item { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--table-border); cursor: pointer; transition: background 0.2s; }
    .settings-item:last-child { border-bottom: none; }
    .settings-item:active { background: rgba(128,128,128,0.1); }
    .settings-icon-box { background: rgba(4, 73, 8, 0.1); color: var(--ion-color-primary); width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-right: 15px; }
    .settings-label { flex: 1; font-weight: 600; font-size: 16px; color: var(--ion-text-color); }
    
    /* Content View */
    .content-card { background: var(--panel); border-radius: 16px; padding: 24px; border: 1px solid var(--table-border); box-shadow: 0 10px 30px rgba(0,0,0,0.05); line-height: 1.8; color: var(--ion-text-color); }
    .content-card h2 { color: var(--ion-color-primary); margin-top: 0; font-weight: bold; }
    
    /* Contact Specific */
    .contact-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 14px; border-radius: 12px; margin-bottom: 15px; font-weight: bold; text-decoration: none; transition: 0.2s; }
    .btn-phone { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid #10b981; }
    .btn-email { background: rgba(59, 130, 246, 0.1); color: #3b82f6; border: 1px solid #3b82f6; }
    .contact-btn:active { transform: scale(0.98); }
  </style>
</head>
<body class="noselect">
  <ion-app>
    
    <div id="view-list" class="view-layer active">
      <ion-header class="ion-no-border">
        <ion-toolbar>
          <ion-buttons slot="start">
            <ion-button onclick="window.location.replace('post-utme-dashboard.html')"><ion-icon name="arrow-back-outline"></ion-icon></ion-button>
          </ion-buttons>
          <ion-title>Settings</ion-title>
        </ion-toolbar>
      </ion-header>
      
      <ion-content class="ion-padding">
        
        <div class="settings-group">
            <div class="settings-item" onclick="openDetail('about')">
                <div class="settings-icon-box"><ion-icon name="information-circle"></ion-icon></div>
                <div class="settings-label">About Us</div>
                <ion-icon name="chevron-forward" color="medium"></ion-icon>
            </div>
            <div class="settings-item" onclick="openDetail('contact')">
                <div class="settings-icon-box"><ion-icon name="headset"></ion-icon></div>
                <div class="settings-label">Contact Support</div>
                <ion-icon name="chevron-forward" color="medium"></ion-icon>
            </div>
        </div>

        <div class="settings-group">
            <div class="settings-item" onclick="openDetail('privacy')">
                <div class="settings-icon-box"><ion-icon name="shield-checkmark"></ion-icon></div>
                <div class="settings-label">Privacy Policy</div>
                <ion-icon name="chevron-forward" color="medium"></ion-icon>
            </div>
            <div class="settings-item" onclick="openDetail('terms')">
                <div class="settings-icon-box"><ion-icon name="document-text"></ion-icon></div>
                <div class="settings-label">Terms & Conditions</div>
                <ion-icon name="chevron-forward" color="medium"></ion-icon>
            </div>
            <div class="settings-item" onclick="openDetail('refund')">
                <div class="settings-icon-box"><ion-icon name="cash"></ion-icon></div>
                <div class="settings-label">Refund Policy</div>
                <ion-icon name="chevron-forward" color="medium"></ion-icon>
            </div>
        </div>

      </ion-content>
    </div>

    <div id="view-details" class="view-layer">
      <ion-header class="ion-no-border">
        <ion-toolbar>
          <ion-buttons slot="start">
            <ion-button onclick="history.back()"><ion-icon name="arrow-back-outline"></ion-icon></ion-button>
          </ion-buttons>
          <ion-title id="detailTitle">Loading...</ion-title>
        </ion-toolbar>
      </ion-header>
      
      <ion-content class="ion-padding">
        
        <div id="contentSkeleton">
            <ion-skeleton-text animated style="height: 30px; width: 60%; border-radius: 8px; margin-bottom: 20px;"></ion-skeleton-text>
            <ion-skeleton-text animated style="height: 15px; border-radius: 4px; margin-bottom: 10px;"></ion-skeleton-text>
            <ion-skeleton-text animated style="height: 15px; border-radius: 4px; margin-bottom: 10px;"></ion-skeleton-text>
            <ion-skeleton-text animated style="height: 15px; border-radius: 4px; margin-bottom: 10px;"></ion-skeleton-text>
            <ion-skeleton-text animated style="height: 15px; width: 80%; border-radius: 4px; margin-bottom: 20px;"></ion-skeleton-text>
        </div>

        <div class="content-card" id="detailContent" style="display: none;">
            </div>

      </ion-content>
    </div>

  </ion-app>

  <script defer src="post-utme-settings.js"></script>
  
</body>
</html>
