<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#f8fafc" id="theme-color-meta" />
<title>Scholars Prep</title>
<link rel="icon" type="image" href="favicon1.png">

<script>
/* ============================================================
   STARTUP ROUTER — runs before anything else paints.
   Decides: welcome.html  OR  which dashboard skeleton to show.
   No Ionic / Supabase JS loaded here on purpose — this file's
   only job is to disappear as fast as possible.
   ============================================================ */

var studentUser = localStorage.getItem('abupq_logged_in_user');
var putmeUser   = localStorage.getItem('post_utme_logged_in_user');
var target = null; // 'student' | 'post-utme' | null

if (studentUser && putmeUser) {
  // Both accounts logged in on this device — trust the last one used.
  var last = localStorage.getItem('lastDashboard');
  target = (last === 'post-utme') ? 'post-utme' : 'student';
} else if (studentUser) {
  target = 'student';
} else if (putmeUser) {
  target = 'post-utme';
}

// Not logged in at all -> bail out immediately, paint nothing.
if (!target) {
  location.replace('welcome.html');
}

// Keep lastDashboard in sync for next time.
if (target) {
  localStorage.setItem('lastDashboard', target);
}

// Apply the correct theme colors before first paint (no white/black flash).
var isDark = false;
if (target === 'student') {
  var spTheme = localStorage.getItem('sp_theme');
  var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  isDark = spTheme === 'dark' || (!spTheme && sysDark);
} else if (target === 'post-utme') {
  isDark = localStorage.getItem('post_utme_theme') === 'dark';
}
if (isDark) {
  document.documentElement.classList.add('dark');
  document.documentElement.style.backgroundColor = '#121212';
} else {
  document.documentElement.style.backgroundColor = '#f8fafc';
}
</script>

<style>
  html, body {
    height: 100%; margin: 0; padding: 0;
    font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
    overflow: hidden;
  }
  :root {
    --bg: #f8fafc;
    --card: #ffffff;
    --accent: #044908;
    --shimmer-a: #e7ebef;
    --shimmer-b: #f4f6f8;
    --muted-line: #dfe3e8;
  }
  header {
  padding-top: env(safe-area-inset-top);
}
  html.dark {
    --bg: #121212;
    --card: #1e1e1e;
    --accent: #1d7a22;
    --shimmer-a: #262626;
    --shimmer-b: #333333;
    --muted-line: #2c2c2c;
  }
  body { background: var(--bg); }

  .sk {
    background: linear-gradient(90deg, var(--shimmer-a) 25%, var(--shimmer-b) 37%, var(--shimmer-a) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease-in-out infinite;
    border-radius: 8px;
  }
  @keyframes shimmer {
    0% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .circle { border-radius: 50%; }

  .page {
    position: fixed; inset: 0;
    display: none;
    flex-direction: column;
    background: var(--bg);
  }
  .page.active { display: flex; }

  /* ---------- shared header ---------- */
  .hdr {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 10px 16px; flex-shrink: 0;
  }
  .hdr-left { display: flex; align-items: center; gap: 8px; }
  .hdr-icons { display: flex; align-items: center; gap: 14px; }

  /* ---------- scrollable body area (visually only, no real scroll needed) ---------- */
  .body-area { flex: 1; padding: 0 16px; overflow: hidden; }

  /* ---------- footer / slider / bottom nav ---------- */
  .slider-sk { margin: 10px 16px; }
  .navbar {
    display: flex; justify-content: space-around; align-items: center;
    padding: 10px 8px calc(10px + env(safe-area-inset-bottom)) 8px;
    border-top: 1px solid var(--muted-line); flex-shrink: 0;
  }
  .navbar .tab { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 56px; }

  /* ================= STUDENT DASHBOARD SKELETON ================= */
  #student-page .welcome-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px 8px 16px;
  }
  #student-page .search-row { padding: 0 16px 10px 16px; }
  #student-page .course-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
    padding-top: 4px;
  }

  /* ================= POST-UTME DASHBOARD SKELETON ================= */
  #putme-page .welcome-block { padding-top: 6px; }
  #putme-page .hero-card {
    border: 1px solid var(--muted-line);
    border-radius: 12px;
    padding: 16px;
    margin-top: 16px;
  }
  #putme-page .hero-card .hero-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  #putme-page .list-item { border-radius: 8px; margin-top: 12px; }
  #putme-page .quick-title { margin: 22px 0 12px 0; }
</style>
</head>
<body onload="startExitTimer()">

  <!-- ======================= STUDENT SKELETON ======================= -->
  <div class="page" id="student-page">
    <div class="hdr">
      <div class="hdr-left">
        <div class="sk circle" style="width:32px;height:32px;"></div>
        <div class="sk" style="width:90px;height:14px;"></div>
      </div>
      <div class="hdr-icons">
        <div class="sk circle" style="width:22px;height:22px;"></div>
        <div class="sk circle" style="width:22px;height:22px;"></div>
        <div class="sk circle" style="width:22px;height:22px;"></div>
      </div>
    </div>
    <div class="welcome-row">
      <div class="sk" style="width:60%;height:22px;"></div>
      <div class="sk circle" style="width:30px;height:30px;"></div>
    </div>
    <div class="search-row">
      <div class="sk" style="width:100%;height:38px;border-radius:12px;"></div>
    </div>
    <div class="body-area">
      <div class="course-grid">
        <div class="sk" style="height:150px;"></div>
        <div class="sk" style="height:150px;"></div>
        <div class="sk" style="height:150px;"></div>
        <div class="sk" style="height:150px;"></div>
        <div class="sk" style="height:150px;"></div>
        <div class="sk" style="height:150px;"></div>
        <div class="sk" style="height:150px;"></div>
        <div class="sk" style="height:150px;"></div>
        <div class="sk" style="height:150px;"></div>
      </div>
    </div>
    <div class="slider-sk">
      <div class="sk" style="width:100%;height:64px;border-radius:12px;"></div>
    </div>
    <div class="navbar">
      <div class="tab"><div class="sk circle" style="width:22px;height:22px;"></div><div class="sk" style="width:34px;height:8px;"></div></div>
      <div class="tab"><div class="sk circle" style="width:22px;height:22px;"></div><div class="sk" style="width:34px;height:8px;"></div></div>
      <div class="tab"><div class="sk circle" style="width:22px;height:22px;"></div><div class="sk" style="width:34px;height:8px;"></div></div>
      <div class="tab"><div class="sk circle" style="width:22px;height:22px;"></div><div class="sk" style="width:34px;height:8px;"></div></div>
    </div>
  </div>

  <!-- ======================= POST-UTME SKELETON ======================= -->
  <div class="page" id="putme-page">
    <div class="hdr">
      <div class="hdr-left">
        <div class="sk circle" style="width:35px;height:35px;"></div>
      </div>
      <div class="hdr-icons">
        <div class="sk" style="width:80px;height:12px;"></div>
        <div class="sk circle" style="width:24px;height:24px;"></div>
      </div>
    </div>
    <div class="body-area welcome-block">
      <div class="sk" style="width:50%;height:26px;margin-bottom:10px;"></div>
      <div class="sk" style="width:80%;height:14px;"></div>

      <div class="hero-card">
        <div class="hero-top">
          <div class="sk circle" style="width:40px;height:40px;"></div>
          <div class="sk" style="width:50%;height:16px;"></div>
        </div>
        <div class="sk" style="width:100%;height:12px;margin-bottom:6px;"></div>
        <div class="sk" style="width:70%;height:12px;margin-bottom:14px;"></div>
        <div class="sk" style="width:120px;height:30px;border-radius:8px;"></div>
      </div>

      <div class="sk quick-title" style="width:40%;height:18px;"></div>
      <div class="sk list-item" style="width:100%;height:70px;"></div>
      <div class="sk list-item" style="width:100%;height:50px;"></div>
    </div>
    <div class="navbar">
      <div class="tab"><div class="sk circle" style="width:22px;height:22px;"></div><div class="sk" style="width:34px;height:8px;"></div></div>
      <div class="tab"><div class="sk circle" style="width:22px;height:22px;"></div><div class="sk" style="width:34px;height:8px;"></div></div>
      <div class="tab"><div class="sk circle" style="width:22px;height:22px;"></div><div class="sk" style="width:34px;height:8px;"></div></div>
      <div class="tab"><div class="sk circle" style="width:22px;height:22px;"></div><div class="sk" style="width:34px;height:8px;"></div></div>
      <div class="tab"><div class="sk circle" style="width:22px;height:22px;"></div><div class="sk" style="width:34px;height:8px;"></div></div>
    </div>
  </div>

<script>
(function () {
  if (!target) return; // already redirecting to welcome.html above

  var page = document.getElementById(target === 'student' ? 'student-page' : 'putme-page');
  page.classList.add('active');

  // Force a synchronous layout/paint calculation. rAF-based timing is not
  // reliable on Android WebView (it can skip compositing before the next
  // task runs), which is what was causing the white/dark blank screen.
  void page.offsetHeight;

  var destination = target === 'student' ? 'dashboard.html' : 'post-utme-dashboard.html';

  // A real timeout (not rAF) gives the WebView's compositor enough time to
  // actually flush this frame to the screen before we navigate away.
  setTimeout(function () {
    location.replace(destination);
  }, 60);
})();
</script>
</body>
</html>
