<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Scholars Prep</title>
    <link rel="icon" type="image" href="favicon1.png">

  <style>
    /* --- VARIABLES --- */
    :root {
      --accent: #dde7da;
      --accent-hover: #5c925e;
      --text-main: #184607;
      --text-muted: #bcdfdd;
      
    
    }

    /* --- RESET --- */
    html, body {
      height: 100%;
      margin: 0;
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
      /* removed background-color from here to prevent covering */
      background: #02040a; 
      overflow: hidden;
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    /* --- SLIDESHOW FIX --- */
    .slideshow {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      /* CRITICAL CHANGE: Changed from -1 to 0 */
      z-index: 0; 
      list-style: none;
      margin: 0;
      padding: 0;
    }
    
    /* Overlay to make text readable */
    .slideshow::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.6); 
      z-index: 1; /* Sits on top of images, below text */
    }

    .slideshow li span {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      opacity: 0;
      z-index: 0; /* Base level */
      animation: imageAnimation 15s linear infinite; 
    }

    /* --- IMAGES (Pointing to img folder) --- */
    /* Using slider9 for all 3 slots temporarily to guarantee visibility */
    .slideshow li:nth-child(1) span { 
        background-image: url('img/slider9.jpg'); 
        
    }
    
    .slideshow li:nth-child(2) span { 
        background-image: url('img/slider6.jpg'); 
        animation-delay: 5s; 
    }
    .slideshow li:nth-child(3) span { 
        background-image: url('img/slider7.jpg'); 
        animation-delay: 10s; 
    }
    .slideshow li:nth-child(4) span { 
        background-image: url('img/slider5.jpg'); 
        animation-delay: 10s; 
    }


    @keyframes imageAnimation { 
      0% { opacity: 0; animation-timing-function: ease-in; }
      10% { opacity: 1; animation-timing-function: ease-out; }
      33% { opacity: 1; } 
      43% { opacity: 0; }
      100% { opacity: 0; }
    }

    /* --- LAYOUT --- */
    .container {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 20px;
      position: relative;
      /* CRITICAL CHANGE: Ensure content is ABOVE slideshow (0) */
      z-index: 10; 
    }

    .logo-img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin-bottom: 24px;
      border: 2px solid rgba(255,255,255,0.1);
      object-fit: cover;
    }

    h1 {
      font-size: 64px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin: 0 0 20px;
      
    }

    .highlight {
      color: var(--accent);
      display: block; 
    }

    p.lead {
      font-size: 18px;
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 0 40px;
      line-height: 1.6;
    }

    .btn-group {
      display: flex;
      flex-direction: row;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 24px; 
      font-size: 14px;
      font-weight: 500;
      border-radius: 6px;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-primary {
      background-color: var(--accent);
      color: #13421d; 
      
    }
    .btn-primary:hover { background-color: var(--accent-hover); }

    .btn-secondary {
      background-color: rgba(5, 66, 8, 0.08);
      color: #fff;
      border: 1px solid rgba(6, 58, 6, 0.1);
    }
    .btn-secondary:hover { background-color: rgba(255, 255, 255, 0.15); }

    @media (max-width: 600px) {
      h1 { font-size: 42px; }
      .btn-group { flex-direction: column; width: 100%; max-width: 300px; }
      .btn { width: 100%; box-sizing: border-box; }
    }
  </style>
</head>
<body>
 <header style="position: relative; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background-color: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
    
    <div class="logo" style="font-size: 24px; font-weight: bold;">
        Scholars Prep
    </div>

    <div style="display: flex; align-items: center; gap: 15px;" id="install-prompt">
        
        <a href="https://github.com/aidesilas123/scholars-prep/releases/download/v6.0/app-debug.apk" 
           style="background-color: #053006; color: white; padding: 8px 16px; text-decoration: none; border-radius: 50px; font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 5px;">
           <span>🤖</span> Download/Update Android App
        </a>

        <a href="login.html" style="text-decoration: none; color: #333; font-weight: bold;">Login</a>
        <a href="login.html" style="background-color: #072e08; color: white; padding: 8px 16px; border-radius: 4px; text-decoration: none;">Sign Up</a>
        
    </div>

</header>
  <ul class="slideshow">
    <li><span></span></li>
    <li><span></span></li>
    <li><span></span></li>
    <li><span></span></li>
    <li><span></span></li>
  </ul>

  <div class="container">
    <img src="favicon1.png" alt="Logo" class="logo-img">
    <h1>
      Build your future
      <span class="highlight">Scholars Prep</span>
    </h1>
    <p class="lead">
      Ignite your potential with world-class learning resources. 
      join a community dedicated to academic excellence today....
    </p>
    <div class="btn-group">
      <a href="login.html" class="btn btn-primary">Login</a>
      <a href="login.html" class="btn btn-secondary">Sign Up</a>
    </div>
  </div>
  <script>
// Notify Capgo that the app is ready and the update was successful
document.addEventListener('DOMContentLoaded', () => {
  if (window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.CapacitorUpdater) {
    Capacitor.Plugins.CapacitorUpdater.notifyAppReady();
  }
});
    window.addEventListener('load', function() {
        // Detect if running in the App (Android WebView)
        const isApp = navigator.userAgent.toLowerCase().includes('wv');
        const downloadBtn = document.getElementById('install-prompt');

        if (isApp && downloadBtn) {
            // User is already in the app, so hide the download button
            downloadBtn.style.display = 'none';
        }
    });
</script>

</body>
</html>
