<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages - Scholars Prep</title>
  <link rel="icon" type="image" href="favicon1.png">
  <style id="iron-cloak">
    html, body { display: none !important; visibility: hidden !important; opacity: 0 !important; }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    (function() {
        const _sb = supabase.createClient('https://xtmoolyxxylylttugjek.supabase.co', 'sb_publishable_Z-w3oC1ZID4SCOnfnFuAjw_CDow4UHG');

        async function strictGuard() {
            const ua = navigator.userAgent.toLowerCase();
            const platform = navigator.platform.toLowerCase();
            
            // 🛡️ THE TRIPLE THREAT CHECK
            const isMobileOS = /android|iphone|ipad|ipod/.test(ua);
            const isApp = ua.includes('wv') || window.Capacitor;
            const hasTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
            
            // Strictly block if it smells like a PC (Windows, Mac, Linux)
            const isPC = /win|mac|linux/.test(platform);

            // 1. Instant Desktop Kick (No DB wait)
            if (isPC && !isApp) {
                window.location.replace('index.html');
                return;
            }

            // 2. Database Check
            const { data } = await _sb.from('site_settings').select('mobile_only_mode').eq('id', 1).single();

            // Logic: If mobile mode is ON, only allow REAL mobile devices
            if (data && data.mobile_only_mode) {
                if (isMobileOS || isApp || (hasTouch && !isPC)) {
                    // VALID MOBILE: Unlock the page
                    unlock();
                } else {
                    // BYPASS ATTEMPT: Kick to index
                    window.location.replace('index.html');
                }
            } else {
                // MAINTENANCE OFF: Unlock for everyone
                unlock();
            }
        }

        function unlock() {
            const cloak = document.getElementById('iron-cloak');
            if (cloak) cloak.remove();
            document.documentElement.style.display = 'block';
        }

        strictGuard();
    })();
</script>
  
  <style>
    /* [Styles remain exactly as they were] */
    body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #051f01, hsl(135, 94%, 6%)); color: white; margin: 0; padding: 0; min-height: 100vh; }
    .container { max-width: 800px; margin: 0 auto; padding: 20px; height: 100vh; display: flex; flex-direction: column; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .back-btn { background: #4CAF50; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; text-decoration: none; display: inline-block; font-size: 14px; }
    .chat-container { flex: 1; display: flex; flex-direction: column; background: rgba(255, 255, 255, 0.05); border-radius: 15px; overflow: hidden; }
    .chat-header { background: #4CAF50; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-radius: 15px 15px 0 0; }
    .chat-messages { flex: 1; padding: 20px; overflow-y: auto; background: #f0f0f0; }
    .message { margin-bottom: 15px; padding: 12px 15px; border-radius: 18px; max-width: 80%; word-wrap: break-word; box-shadow: 0 1px 2px rgba(0,0,0,0.1); color: #333; }
    .message.sent { background: #dcf8c6; margin-left: auto; border-bottom-right-radius: 5px; }
    .message.received { background: white; margin-right: auto; border-bottom-left-radius: 5px; }
    .message-sender { font-weight: bold; margin-bottom: 5px; font-size: 14px; }
    .message-time { font-size: 11px; color: #666; margin-top: 5px; text-align: right; }
    .message-status { font-size: 11px; color: #666; display: inline-block; margin-left: 8px; }
    .chat-input { display: flex; padding: 15px; border-top: 1px solid #ddd; background: white; border-radius: 0 0 15px 15px; }
    .chat-input input { flex: 1; padding: 12px 15px; border: 1px solid #ddd; border-radius: 20px; margin-right: 10px; font-size: 14px; outline: none; color: #333; }
    .chat-input input:focus { border-color: #4CAF50; }
    .chat-input button { background: #4CAF50; color: white; border: none; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: background 0.3s; }
    .chat-input button:hover { background: #45a049; }
    .chat-input button:disabled { background: #cccccc; cursor: not-allowed; }
    .empty-state { text-align: center; padding: 40px 20px; color: #666; }
    .loading { text-align: center; padding: 20px; color: #666; }
    .chat-messages::-webkit-scrollbar { width: 6px; }
    .chat-messages::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.1); border-radius: 3px; }
    .chat-messages::-webkit-scrollbar-thumb { background: #4CAF50; border-radius: 3px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>💬 Contact Admin</h1>
      <a href="dashboard.html" class="back-btn">← Back to Dashboard</a>
    </div>
    
    <div class="chat-container">
      <div class="chat-header">
        <strong>Admin Support</strong>
        <span style="font-size: 12px; opacity: 0.9;">Online</span>
      </div>
      
      <div id="chatMessages" class="chat-messages">
        <div class="loading">Loading messages...</div>
      </div>
      
      <div class="chat-input">
        <input 
          type="text" 
          id="chatInput" 
          placeholder="Type your message..." 
        >
        <button id="sendBtn">➤</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  if ('serviceWorker' in navigator) {

</script>

  
  
</body>
