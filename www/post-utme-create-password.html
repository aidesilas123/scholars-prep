<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Set Password</title>
  <link rel="icon" type="image" href="favicon1.png">
  
  <script defer type="module" src="assets/ionic-core/dist/ionic/ionic.esm.js"></script>
  <script defer nomodule src="assets/ionic-core/dist/ionic/ionic.js"></script>
  <link rel="stylesheet" href="assets/ionic-core/css/ionic.bundle.css" />
  <script defer src="app-init.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root { --background: url('img/slider5.jpg'); --accent: #044908; --muted: #8f96a3; }
    
    html, body { height: 100%; margin: 0; font-family: Inter, sans-serif; background: var(--background) no-repeat center center fixed; background-size: cover; }
    .container { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 20px; position: relative; z-index: 10; }
    .card { width: 420px; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(15px); border-radius: 18px; padding: 34px; box-shadow: 0 10px 30px rgba(12, 20, 40, 0.25); }
    h1 { text-align: center; margin: 0 0 8px; color: #07520e; font-size: 32px; font-weight: bold; }
    p.lead { margin: 0 0 20px; text-align: center; color: #4a5568; font-size: 14px; }
    ion-item { --background: transparent; margin-bottom: 12px; border-radius: 8px; border: 1px solid #e2e8f0; }
    .btn-submit { margin-top: 16px; font-weight: bold; --border-radius: 10px; }
    
    .modal-overlay { position: fixed; inset: 0; background: rgba(6,12,34,0.45); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal { background: #fff; border-radius: 10px; padding: 18px 20px; width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
    .modal h3 { margin: 0 0 8px; font-size: 18px; color: #21324a; }
    .modal p { margin: 0 0 12px; color: #445; font-size: 14px; }
    .loading-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); display: none; align-items: center; justify-content: center; z-index: 9999; backdrop-filter: blur(4px); }
    .page-loading { display: flex; flex-direction: column; align-items: center; gap: 20px; background: rgba(19, 1, 1, 0.85); padding: 40px; border-radius: 16px; }
    .loading-spinner { width: 40px; height: 40px; border: 3px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top-color: var(--accent); animation: spin 1s infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    header {
  padding-top: env(safe-area-inset-top);
}
  </style>
</head>
<body>
  <div class="loading-overlay" id="globalLoading">
    <div class="page-loading">
      <div class="loading-spinner"></div>
      <div style="font-size: 18px; font-weight: 600; color: white;">Securing Account...</div>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <h1 id="formTitle">Create Password</h1>
      <p class="lead" id="formSubtitle">Your email is verified! Set a password to complete registration.</p>

      <div>
        <ion-item>
          <ion-input id="newPassword" type="password" label="New Password" label-placement="floating"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input id="confirmPassword" type="password" label="Confirm Password" label-placement="floating"></ion-input>
        </ion-item>
        <ion-button expand="block" class="btn-submit" id="savePasswordBtn">Save & Continue</ion-button>
      </div>
    </div>
  </div>
  
  <div id="modalRoot" style="display:none;"></div>
  <script defer src="post-utme-create-password.js"></script>
</body>
</html>
