<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Past Questions - Scholars Prep</title>
  <link rel="icon" type="image" href="favicon1.png">
  
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #073601, #023004);
      color: #fff;
      margin: 0;
      padding: 0;
      text-align: center;
      /* Prevent text selection */
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    /* Tiled Watermark Container */
    .watermark-grid {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
      display: flex;
      flex-wrap: wrap;
      overflow: hidden;
      opacity: 0.04; /* Faint but visible */
      justify-content: space-around;
      align-content: space-around;
    }

    .watermark-item {
      transform: rotate(-30deg);
      font-size: 20px;
      font-weight: 900;
      color: #ffffff;
      padding: 40px;
      white-space: nowrap;
    }

    /* Content Wrapper (Z-index 1 to sit above watermark) */
    .content-wrapper {
      position: relative;
      z-index: 1;
    }

    /* Loading Overlay */
    .loading-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8); display: none;
      align-items: center; justify-content: center; z-index: 2000;
      backdrop-filter: blur(5px);
    }
    
    .page-loading {
      display: flex; flex-direction: column; align-items: center; gap: 20px;
      background: rgba(14, 224, 28, 0.12); padding: 40px; border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.12);
    }
    
    .loading-spinner {
      width: 40px; height: 40px; border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%; border-top-color: #4CAF50; animation: spin 1s ease-in-out infinite;
    }
    
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Course Grid */
    .course-list {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px; padding: 20px; max-width: 1000px; margin: 0 auto;
    }

    .course-card {
      background: rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 25px;
      border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(5px);
      transition: transform 0.2s, background 0.3s;
    }
    .course-card:active { transform: scale(0.98); }

    .action-btn {
      border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer;
      font-weight: bold; margin: 5px; flex: 1; min-width: 70px;
    }

    /* Questions UI */
    .questions-container {
      display: none; padding: 20px; text-align: left; max-width: 800px; margin: 0 auto;
    }

    .question-item {
      background: rgba(20, 20, 20, 0.6); border-radius: 12px;
      padding: 20px; margin-bottom: 25px; border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .question-text { font-size: 17px; margin-bottom: 15px; font-weight: 600; line-height: 1.5; }

    .option-item {
      padding: 12px; margin: 8px 0; background: rgba(255, 255, 255, 0.03);
      border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);
      display: flex; align-items: center;
    }

    .option-item.correct {
      border: 1px solid #4CAF50; background: rgba(76, 175, 80, 0.15);
    }

    .checkmark { margin-right: 12px; font-weight: bold; color: #4CAF50; }
    .circle-mark { margin-right: 12px; opacity: 0.5; font-size: 14px; }

    /* Solution Box Styles */
    .reveal-btn {
      background: linear-gradient(135deg, #ff9800, #f57c00);
      color: white; border: none; padding: 10px 20px;
      border-radius: 8px; cursor: pointer; font-weight: bold;
      margin-top: 15px; width: 100%; display: flex;
      align-items: center; justify-content: center; gap: 8px;
    }
    .reveal-btn:hover { filter: brightness(1.1); }

    .solution-box {
      display: none; /* Hidden by default */
      margin-top: 15px; padding: 15px;
      background: rgba(63, 102, 255, 0.15);
      border-left: 4px solid #3f66ff;
      border-radius: 6px;
      font-size: 15px; line-height: 1.6; color: #e0e7ff;
      animation: slideDown 0.3s ease-out;
    }
    .solution-box strong { color: #3f66ff; display: block; margin-bottom: 5px; }

    @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

    /* Modal */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9); justify-content: center; align-items: center; z-index: 3000;
    }
    .modal-content {
      background: #1e1e1e; color: #fff; padding: 30px; border-radius: 16px;
      width: 90%; max-width: 400px; text-align: center; border: 1px solid #333;
    }
    .year-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 20px 0; }
    .year-card {
      padding: 12px; background: #333; border-radius: 8px; cursor: pointer;
      border: 1px solid #444; transition: 0.2s;
    }
    .year-card:active { background: #4CAF50; border-color: #4CAF50; }
    .back-btn { background: #333; color: white; border: 1px solid #555; padding: 8px 16px; border-radius: 20px; cursor: pointer; margin-bottom: 15px; }

    /* Screenshot Protection Blur */
    .blur-content { filter: blur(15px); }
  </style>
</head>
<body>

  <div class="watermark-grid" id="watermarkGrid"></div>

  <div class="loading-overlay" id="globalLoading">
    <div class="page-loading">
      <div class="loading-spinner"></div>
      <div>Loading...</div>
    </div>
  </div>

  <div class="content-wrapper" id="mainWrapper">

    <style>
      :root{ --nav-grad: linear-gradient(135deg,#063b08,#083502 60%); }
      .topbar{ position: fixed; inset: 0 0 auto 0; height: 64px; z-index: 1000; display:flex; align-items:center; padding: 0 16px; background: var(--nav-grad); border-bottom: 1px solid rgba(255,255,255,0.1); }
      .brand{ font-weight:800; color:#fff; flex:1; }
      .nav-links a{ color:#fff; text-decoration:none; margin-left:15px; font-weight:600; font-size:14px; opacity:0.8; }
      .nav-links a.active{ opacity:1; text-decoration:underline; }
      body { padding-top: 70px; }
    </style>
    <header class="topbar">
      <div class="brand" onclick="location.href='dashboard.html'">Scholars Prep</div>
      <nav class="nav-links">
        <a href="dashboard.html">Home</a>
        <a href="pastquestions.html" class="active">Past Qs</a>
        <a href="cbt.html">CBT</a>
      </nav>
    </header>

    <div style="text-align: center; margin: 20px 0;">
      <h2>📘 Past Questions Archive</h2>
      <p style="color:#aaa; font-size:14px;">(2019 - 2025)</p>
    </div>

    <div class="course-list" id="courseList"></div>

    <div class="questions-container" id="questionsContainer">
      <button class="back-btn" onclick="goBackToCourses()">← Select Another Course</button>
      <h3 id="questionsTitle" style="border-bottom:1px solid rgba(255,255,255,0.2); padding-bottom:10px;"></h3>
      <div id="questionsList"></div>
    </div>

  </div>

  <div class="modal" id="yearModal">
    <div class="modal-content">
      <h3 id="modalCourseTitle">Select Year</h3>
      <div class="year-grid" id="yearGrid"></div>
      <button class="back-btn" onclick="closeYearModal()" style="background:#d32f2f; border:none;">Cancel</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://xtmoolyxxylylttugjek.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0bW9vbHl4eHlseWx0dHVnamVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5ODI5MTUsImV4cCI6MjA4NTM0MjkxNX0.2ZdfheXA3EtLLoCZenNVmoHq8XDe4geFdUVHAanwNYQ';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let selectedCourseId = null;
    let selectedCourseCode = '';
    let selectedType = '';

    // --- 1. Security & Watermark Logic ---
    document.addEventListener('DOMContentLoaded', () => {
      const user = JSON.parse(localStorage.getItem('abupq_logged_in_user') || 'null');
      if (!user) { window.location.href = 'index.html'; return; }

      // Generate Tiled Watermark
      const grid = document.getElementById('watermarkGrid');
      const email = user.email || 'User';
      // Create 30 copies of the email to fill screen
      for(let i=0; i<30; i++) {
        const div = document.createElement('div');
        div.className = 'watermark-item';
        div.textContent = email;
        grid.appendChild(div);
      }

      // Load Courses
      loadCourses();

      // Screenshot Deterrent (Blur on tab switch)
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          document.body.classList.add("blur-content");
        } else {
          document.body.classList.remove("blur-content");
        }
      });
    });

    // --- 2. Load Courses ---
    async function loadCourses() {
      showLoading(true);
      try {
        const { data: courses, error } = await supabaseClient
          .from('courses')
          .select('*')
          .order('code');

        if(error) throw error;

        const list = document.getElementById('courseList');
        list.innerHTML = '';

        // Group courses
        const groups = {};
        courses.forEach(c => {
          if(!groups[c.code]) groups[c.code] = [];
          groups[c.code].push(c);
        });

        Object.keys(groups).forEach(code => {
          const variants = groups[code];
          const div = document.createElement('div');
          div.className = 'course-card';
          
          let btns = '';
          variants.forEach(v => {
            const color = v.type === 'exam' ? '#4CAF50' : '#2196F3';
            btns += `<button class="action-btn" style="background:${color}; color:white;" onclick="openYearSelect('${v.id}', '${v.code}', '${v.type}')">${v.type.toUpperCase()}</button>`;
          });

          div.innerHTML = `
            <div style="font-size:20px; font-weight:800; margin-bottom:10px;">${code}</div>
            <div style="display:flex; flex-wrap:wrap; justify-content:center;">${btns}</div>
          `;
          list.appendChild(div);
        });

      } catch(e) {
        console.error(e);
        alert('Error loading courses');
      } finally {
        showLoading(false);
      }
    }

    // --- 3. Year Selection ---
    async function openYearSelect(id, code, type) {
      selectedCourseId = id;
      selectedCourseCode = code;
      selectedType = type;
      showLoading(true);

      try {
        const { data: years } = await supabaseClient
          .from('questions')
          .select('year')
          .eq('course_id', id);

        const uniqueYears = [...new Set(years.map(y => y.year))].sort((a,b) => b-a);
        
        const grid = document.getElementById('yearGrid');
        grid.innerHTML = '';
        document.getElementById('modalCourseTitle').textContent = `${code} (${type}) Years`;

        uniqueYears.forEach(year => {
          const d = document.createElement('div');
          d.className = 'year-card';
          d.textContent = year;
          d.onclick = () => loadQuestions(year);
          grid.appendChild(d);
        });

        document.getElementById('yearModal').style.display = 'flex';
      } catch(e) {
        console.error(e);
      } finally {
        showLoading(false);
      }
    }

    function closeYearModal() {
      document.getElementById('yearModal').style.display = 'none';
    }

    // --- 4. Load Questions & Solutions ---
    async function loadQuestions(year) {
      closeYearModal();
      showLoading(true);

      try {
        // Fetch questions INCLUDING the 'Details' column
        const { data: qs, error } = await supabaseClient
          .from('questions')
          .select('*') // This fetches Details automatically if column exists
          .eq('course_id', selectedCourseId)
          .eq('year', year)
          .order('id');

        if(error) throw error;

        const container = document.getElementById('questionsList');
        container.innerHTML = '';
        document.getElementById('questionsTitle').textContent = `${selectedCourseCode} ${selectedType.toUpperCase()} - ${year}`;

        qs.forEach((q, idx) => {
          const ansIdx = parseInt(q.answer);
          const opts = q.options || [];
          // Handle case where Details column might be lowercase or capitalized in DB
          const solutionText = q.Details || q.details || "No explanation provided for this question.";

          let optHtml = '';
          opts.forEach((opt, i) => {
            const isCorrect = i === ansIdx;
            optHtml += `
              <div class="option-item ${isCorrect ? 'correct' : ''}">
                ${isCorrect ? '<span class="checkmark">✔</span>' : '<span class="circle-mark">○</span>'}
                ${String.fromCharCode(65+i)}. ${opt}
              </div>
            `;
          });

          const div = document.createElement('div');
          div.className = 'question-item';
          div.innerHTML = `
            <div class="question-text">Q${idx+1}. ${q.question_text}</div>
            <div>${optHtml}</div>
            
            <button class="reveal-btn" onclick="toggleSolution('sol-${idx}')">
              💡 Reveal Solution
            </button>
            
            <div id="sol-${idx}" class="solution-box">
              <strong>Solving / Explanation:</strong>
              ${solutionText}
            </div>
          `;
          container.appendChild(div);
        });

        document.getElementById('courseList').style.display = 'none';
        document.getElementById('questionsContainer').style.display = 'block';

      } catch(e) {
        console.error(e);
        alert('Error loading questions');
      } finally {
        showLoading(false);
      }
    }

    // --- 5. Toggle Solution Visibility ---
    window.toggleSolution = function(id) {
      const box = document.getElementById(id);
      if(box.style.display === 'block') {
        box.style.display = 'none';
      } else {
        box.style.display = 'block';
      }
    };

    function goBackToCourses() {
      document.getElementById('questionsContainer').style.display = 'none';
      document.getElementById('courseList').style.display = 'grid';
    }

    function showLoading(b) {
      document.getElementById('globalLoading').style.display = b ? 'flex' : 'none';
    }

    // --- Security Prevention ---
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.addEventListener('keydown', function(e) {
      if((e.ctrlKey || e.metaKey) && (e.key === 'p' || e.key === 's')) {
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
