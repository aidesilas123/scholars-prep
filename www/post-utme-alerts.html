<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Alerts — Scholars Prep</title>
  <link rel="icon" type="image" href="favicon1.png">
  
  <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"></script>
  <script nomodule src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core/css/ionic.bundle.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --ion-color-primary: #044908;
      --panel: #ffffff;
      --muted: #8f96a3;
      --page-bg: #f3f4f6;
      --table-border: rgba(128,128,128,0.2);
    }

    body.dark, body.dark-mode {
      --ion-background-color: #121212; 
      --ion-text-color: #ffffff; 
      --panel: #1e1e1e;
      --page-bg: #121212;
      --table-border: rgba(255,255,255,0.1);
    }

    body { background: var(--page-bg); font-family: Inter, sans-serif; }
    ion-app:not(.hydrated) { visibility: hidden; opacity: 0; }
    ion-app.hydrated { visibility: visible; opacity: 1; transition: opacity 0.3s ease; }
    
    /* Linear Navigation Stack Animations */
    .view-layer { display: none; height: 100%; width: 100%; flex-direction: column; }
    .view-layer.active { display: flex; animation: slideInRight 0.3s cubic-bezier(0.25, 0.8, 0.25, 1) forwards; }
    @keyframes slideInRight { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }

    /* Alert List Card */
    .alert-card {
        background: var(--panel); border: 1px solid var(--table-border);
        border-radius: 12px; padding: 16px; margin-bottom: 12px;
        display: flex; gap: 15px; align-items: center;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05); cursor: pointer;
        transition: transform 0.2s;
    }
    .alert-card:active { transform: scale(0.98); }
    
    .alert-icon-box {
        background: rgba(4, 73, 8, 0.1); color: var(--ion-color-primary);
        width: 45px; height: 45px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center; font-size: 24px;
        flex-shrink: 0;
    }

    .alert-content { flex: 1; overflow: hidden; }
    .alert-title { font-weight: bold; font-size: 16px; margin: 0 0 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .alert-preview { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .alert-time { font-size: 11px; color: var(--muted); margin-top: 6px; display: block; font-weight: 600; }

    /* Detail View Styling */
    .detail-card {
        background: var(--panel); border: 1px solid var(--table-border);
        border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        margin-top: 10px;
    }
    .detail-date { color: var(--ion-color-primary); font-size: 13px; font-weight: bold; margin-bottom: 10px; display: block; }
    .detail-title { font-size: 22px; font-weight: 800; margin: 0 0 20px 0; line-height: 1.3; }
    .detail-message { color: var(--ion-text-color); line-height: 1.7; font-size: 15px; }
  </style>
</head>
<body class="noselect">
  <ion-app>
    
    <div id="view-list" class="view-layer active">
      <ion-header class="ion-no-border">
        <ion-toolbar>
          <ion-buttons slot="start">
            <ion-button onclick="window.location.replace('/post-utme-dashboard')"><ion-icon name="arrow-back-outline"></ion-icon></ion-button>
          </ion-buttons>
          <ion-title>Alerts</ion-title>
        </ion-toolbar>
      </ion-header>
      
      <ion-content class="ion-padding">
        <div id="alertSkeleton">
            <ion-skeleton-text animated style="height: 80px; border-radius: 12px; margin-bottom: 12px;"></ion-skeleton-text>
            <ion-skeleton-text animated style="height: 80px; border-radius: 12px; margin-bottom: 12px;"></ion-skeleton-text>
            <ion-skeleton-text animated style="height: 80px; border-radius: 12px; margin-bottom: 12px;"></ion-skeleton-text>
        </div>
        
        <div id="emptyState" style="display: none; text-align: center; padding-top: 60px; color: var(--muted);">
            <ion-icon name="notifications-off-outline" style="font-size: 72px; opacity: 0.3;"></ion-icon>
            <p style="margin-top: 16px; font-size: 16px;">No new alerts at the moment.</p>
        </div>

        <div id="alertListContainer"></div>
      </ion-content>
    </div>

    <div id="view-details" class="view-layer">
      <ion-header class="ion-no-border">
        <ion-toolbar>
          <ion-buttons slot="start">
            <ion-button onclick="history.back()"><ion-icon name="arrow-back-outline"></ion-icon></ion-button>
          </ion-buttons>
          <ion-title>Message</ion-title>
        </ion-toolbar>
      </ion-header>
      
      <ion-content class="ion-padding">
        <div class="detail-card">
            <span class="detail-date" id="detailDate">May 16, 2026, 11:02 PM</span>
            <h1 class="detail-title" id="detailTitle">Loading...</h1>
            <div class="detail-message" id="detailMessage">
                </div>
        </div>
      </ion-content>
    </div>

  </ion-app>

  <script src="post-utme-alerts.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js'); });
    }
  </script>
</body>
</html>
