<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reset Your Password — ABU PQ</title>
  <style id="iron-cloak">
    html, body { display: none !important; visibility: hidden !important; opacity: 0 !important; }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    (function() {
        const _sb = supabase.createClient('https://xtmoolyxxylylttugjek.supabase.co', 'sb_publishable_Z-w3oC1ZID4SCOnfnFuAjw_CDow4UHG');

        async function strictGuard() {
            const ua = navigator.userAgent.toLowerCase();
            const platform = navigator.platform.toLowerCase();
            
            // 🛡️ THE TRIPLE THREAT CHECK
            const isMobileOS = /android|iphone|ipad|ipod/.test(ua);
            const isApp = ua.includes('wv') || window.Capacitor;
            const hasTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
            
            // Strictly block if it smells like a PC (Windows, Mac, Linux)
            const isPC = /win|mac|linux/.test(platform);

            // 1. Instant Desktop Kick (No DB wait)
            if (isPC && !isApp) {
                window.location.replace('index.html');
                return;
            }

            // 2. Database Check
            const { data } = await _sb.from('site_settings').select('mobile_only_mode').eq('id', 1).single();

            // Logic: If mobile mode is ON, only allow REAL mobile devices
            if (data && data.mobile_only_mode) {
                if (isMobileOS || isApp || (hasTouch && !isPC)) {
                    // VALID MOBILE: Unlock the page
                    unlock();
                } else {
                    // BYPASS ATTEMPT: Kick to index
                    window.location.replace('index.html');
                }
            } else {
                // MAINTENANCE OFF: Unlock for everyone
                unlock();
            }
        }

        function unlock() {
            const cloak = document.getElementById('iron-cloak');
            if (cloak) cloak.remove();
            document.documentElement.style.display = 'block';
        }

        strictGuard();
    })();
</script>
  <style>
    :root {
      --background: url('img/slider5.jpg');
      --accent: #044908;
      --accent-dark: #02270a;
      --radius: 12px;
    }
    html, body {
      height: 100%; margin: 0;
      font-family: Inter, sans-serif;
      background: var(--background) no-repeat center center fixed;
      background-size: cover;
    }
    .container { height: 100%; display: flex; align-items: center; justify-content: center; }
    .card {
      width: 400px; padding: 30px; border-radius: 18px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      color: #fff;
    }
    h2 { text-align: center; color: #fff; margin-bottom: 10px; }
    p { text-align: center; font-size: 14px; margin-bottom: 20px; }
    input {
      width: 100%; padding: 12px; margin-bottom: 15px;
      border-radius: 8px; border: none; box-sizing: border-box;
    }
    .btn {
      width: 100%; padding: 12px; border-radius: 10px; border: none;
      background: linear-gradient(180deg, var(--accent), var(--accent-dark));
      color: #fff; font-weight: 600; cursor: pointer;
    }
    #status { text-align: center; margin-top: 15px; font-weight: bold; font-size: 14px; }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h2>New Password</h2>
    <p>Please enter your new secure password below.</p>
    
    <form id="updatePasswordForm">
      <input type="password" id="newPassword" placeholder="New Password" required minlength="6" />
      <input type="password" id="confirmNewPassword" placeholder="Confirm New Password" required />
      <button type="submit" class="btn" id="updateBtn">Update Password</button>
    </form>
    
    <div id="status"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // This ensures the Supabase library is fully loaded before we use it
  window.onload = function() {
    const SUPABASE_URL = 'https://xtmoolyxxylylttugjek.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Z-w3oC1ZID4SCOnfnFuAjw_CDow4UHG';
    
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const updateForm = document.getElementById('updatePasswordForm');
    const statusDiv = document.getElementById('status');

    updateForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmNewPassword').value;
      const btn = document.getElementById('updateBtn');

      if (newPassword !== confirmPassword) {
        statusDiv.style.color = "#ffcccc";
        statusDiv.textContent = "Passwords do not match!";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Updating...";

      const { data, error } = await supabaseClient.auth.updateUser({ password: newPassword });

      if (error) {
        statusDiv.style.color = "#ffcccc";
        statusDiv.textContent = error.message;
        btn.disabled = false;
        btn.textContent = "Update Password";
      } else {
        statusDiv.style.color = "#ccffcc";
        statusDiv.textContent = "Password updated! Redirecting to login...";
        
        // Clear everything to ensure a clean new login
        localStorage.clear();
        
        setTimeout(() => {
          window.location.href = 'index.html'; 
        }, 3000);
      }
    });
  };
</script>

</body>
</html>
