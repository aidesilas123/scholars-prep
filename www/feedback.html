<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send Feedback - Scholars Prep</title>
  <link rel="icon" type="image" href="favicon1.png">
  <style id="desktop-guard-css">
    @media screen and (min-width: 1025px) {
        body { display: none !important; }
    }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    (async function() {
        // Initialize your client
        const _sb = supabase.createClient('https://xtmoolyxxylylttugjek.supabase.co', 'sb_publishable_Z-w3oC1ZID4SCOnfnFuAjw_CDow4UHG');

        // 🛡️ HARDWARE & OS DETECTION
        const ua = navigator.userAgent.toLowerCase();
        const isMobileOS = /android|iphone|ipad|ipod/.test(ua);
        const hasTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        
        // If it lacks a mobile OS OR lacks a touchscreen, it's a Desktop
        const isLikelyDesktop = !isMobileOS || !hasTouch;

        // 🛡️ DATABASE CHECK
        const { data } = await _sb.from('site_settings').select('mobile_only_mode').eq('id', 1).single();

        if (data && data.mobile_only_mode) {
            if (isLikelyDesktop) {
                // REDIRECT: Boot them back to the landing page
                window.location.href = 'index.html';
            }
        } else {
            // Mode is OFF: Reveal the page content
            const styleBlock = document.getElementById('desktop-guard-css');
            if (styleBlock) styleBlock.remove();
        }
    })();
</script>
  <style>
    :root {
      --primary: #063b08;
      --secondary: #083502;
      --accent: #4CAF50;
      --glass: rgba(255, 255, 255, 0.1);
      --glass-hover: rgba(255, 255, 255, 0.15);
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .back-btn {
      background: var(--glass);
      color: white;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 6px;
      transition: 0.3s;
    }
    .back-btn:hover { background: var(--glass-hover); }

    /* Form Card */
    .card {
      background: var(--glass);
      padding: 30px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 40px;
    }

    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: bold; }
    
    .form-control {
      width: 100%;
      padding: 12px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      color: white;
      box-sizing: border-box;
    }
    .form-control:focus { outline: none; border-color: var(--accent); }

    select.form-control option {
        background: #063b08; /* Fix for dropdown background */
        color: white;
    }

    .btn-submit {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
      transition: 0.3s;
    }
    .btn-submit:hover { background: #45a049; }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    /* History Table */
    .history-section h3 { border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
    
    .history-item {
        background: rgba(255,255,255,0.05);
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .item-meta { font-size: 12px; color: #ccc; margin-bottom: 4px; }
    .item-subject { font-weight: bold; font-size: 16px; }
    
    .badge {
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 11px;
        text-transform: uppercase;
        font-weight: bold;
    }
    .badge.pending { background: #ffc107; color: black; }
    .badge.resolved { background: var(--accent); color: white; }

    .empty-state { text-align: center; opacity: 0.6; padding: 20px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>📝 Send Feedback</h1>
    <a href="dashboard.html" class="back-btn">← Dashboard</a>
  </div>

  <div class="card">
    <div class="form-group">
      <label>Feedback Type</label>
      <select id="type" class="form-control">
        <option value="feedback">General Feedback</option>
        <option value="complaint">Complaint / Issue</option>
      </select>
    </div>
    <div class="form-group">
      <label>Subject</label>
      <input type="text" id="subject" class="form-control" placeholder="Brief summary...">
    </div>
    <div class="form-group">
      <label>Message</label>
      <textarea id="message" class="form-control" rows="5" placeholder="Describe your issue or suggestion..."></textarea>
    </div>
    <button id="submitBtn" class="btn-submit" onclick="submitFeedback()">Submit</button>
  </div>

  <div class="history-section">
    <h3>My Previous Submissions</h3>
    <div id="historyList">
        <div class="empty-state">Loading history...</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://xtmoolyxxylylttugjek.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_Z-w3oC1ZID4SCOnfnFuAjw_CDow4UHG';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentUser = null;

  document.addEventListener('DOMContentLoaded', async () => {
    const userData = JSON.parse(localStorage.getItem('abupq_logged_in_user') || '{}');
    if (!userData.id) {
        window.location.href = 'index.html';
        return;
    }
    currentUser = userData;
    loadHistory();
  });

  async function submitFeedback() {
    const type = document.getElementById('type').value;
    const subject = document.getElementById('subject').value.trim();
    const message = document.getElementById('message').value.trim();
    const btn = document.getElementById('submitBtn');

    if (!subject || !message) {
        alert("Please fill in all fields.");
        return;
    }

    btn.disabled = true;
    btn.innerText = "Submitting...";

    try {
        const { error } = await supabaseClient
            .from('feedback')
            .insert({
                user_id: currentUser.id,
                type: type,
                subject: subject,
                message: message,
                status: 'pending'
            });

        if (error) throw error;

        alert("Thank you! We have received your submission.");
        
        // Reset form
        document.getElementById('subject').value = '';
        document.getElementById('message').value = '';
        
        // Refresh list
        loadHistory();

    } catch (error) {
        console.error("Error submitting:", error);
        alert("Failed to submit. Please try again.");
    } finally {
        btn.disabled = false;
        btn.innerText = "Submit";
    }
  }

  async function loadHistory() {
    const list = document.getElementById('historyList');
    
    const { data, error } = await supabaseClient
        .from('feedback')
        .select('*')
        .eq('user_id', currentUser.id)
        .order('created_at', { ascending: false });

    if (error) {
        console.error(error);
        return;
    }

    if (!data || data.length === 0) {
        list.innerHTML = '<div class="empty-state">No submissions yet.</div>';
        return;
    }

    list.innerHTML = data.map(item => `
        <div class="history-item">
            <div>
                <div class="item-meta">
                    ${new Date(item.created_at).toLocaleDateString()} • ${item.type.toUpperCase()}
                </div>
                <div class="item-subject">${escapeHtml(item.subject)}</div>
            </div>
            <div class="badge ${item.status}">${item.status}</div>
        </div>
    `).join('');
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
</script>

</body>
</html>
