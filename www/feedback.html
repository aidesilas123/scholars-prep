<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send Feedback - Scholars Prep</title>
  <link rel="icon" type="image" href="favicon1.png">
  <style id="iron-cloak">
    html, body { display: none !important; visibility: hidden !important; opacity: 0 !important; }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    (function() {
        const _sb = supabase.createClient('https://xtmoolyxxylylttugjek.supabase.co', 'sb_publishable_Z-w3oC1ZID4SCOnfnFuAjw_CDow4UHG');

        async function strictGuard() {
            const ua = navigator.userAgent.toLowerCase();
            const platform = navigator.platform.toLowerCase();
            
            // 🛡️ THE TRIPLE THREAT CHECK
            const isMobileOS = /android|iphone|ipad|ipod/.test(ua);
            const isApp = ua.includes('wv') || window.Capacitor;
            const hasTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
            
            // Strictly block if it smells like a PC (Windows, Mac, Linux)
            const isPC = /win|mac|linux/.test(platform);

            // 1. Instant Desktop Kick (No DB wait)
            if (isPC && !isApp) {
                window.location.replace('index.html');
                return;
            }

            // 2. Database Check
            const { data } = await _sb.from('site_settings').select('mobile_only_mode').eq('id', 1).single();

            // Logic: If mobile mode is ON, only allow REAL mobile devices
            if (data && data.mobile_only_mode) {
                if (isMobileOS || isApp || (hasTouch && !isPC)) {
                    // VALID MOBILE: Unlock the page
                    unlock();
                } else {
                    // BYPASS ATTEMPT: Kick to index
                    window.location.replace('index.html');
                }
            } else {
                // MAINTENANCE OFF: Unlock for everyone
                unlock();
            }
        }

        function unlock() {
            const cloak = document.getElementById('iron-cloak');
            if (cloak) cloak.remove();
            document.documentElement.style.display = 'block';
        }

        strictGuard();
    })();
</script>
  <style>
    :root {
      --primary: #063b08;
      --secondary: #083502;
      --accent: #4CAF50;
      --glass: rgba(255, 255, 255, 0.1);
      --glass-hover: rgba(255, 255, 255, 0.15);
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .back-btn {
      background: var(--glass);
      color: white;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 6px;
      transition: 0.3s;
    }
    .back-btn:hover { background: var(--glass-hover); }

    /* Form Card */
    .card {
      background: var(--glass);
      padding: 30px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 40px;
    }

    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: bold; }
    
    .form-control {
      width: 100%;
      padding: 12px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      color: white;
      box-sizing: border-box;
    }
    .form-control:focus { outline: none; border-color: var(--accent); }

    select.form-control option {
        background: #063b08; /* Fix for dropdown background */
        color: white;
    }

    .btn-submit {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
      transition: 0.3s;
    }
    .btn-submit:hover { background: #45a049; }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    /* History Table */
    .history-section h3 { border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
    
    .history-item {
        background: rgba(255,255,255,0.05);
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .item-meta { font-size: 12px; color: #ccc; margin-bottom: 4px; }
    .item-subject { font-weight: bold; font-size: 16px; }
    
    .badge {
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 11px;
        text-transform: uppercase;
        font-weight: bold;
    }
    .badge.pending { background: #ffc107; color: black; }
    .badge.resolved { background: var(--accent); color: white; }

    .empty-state { text-align: center; opacity: 0.6; padding: 20px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>📝 Send Feedback</h1>
    <a href="dashboard.html" class="back-btn">← Dashboard</a>
  </div>

  <div class="card">
    <div class="form-group">
      <label>Feedback Type</label>
      <select id="type" class="form-control">
        <option value="feedback">General Feedback</option>
        <option value="complaint">Complaint / Issue</option>
      </select>
    </div>
    <div class="form-group">
      <label>Subject</label>
      <input type="text" id="subject" class="form-control" placeholder="Brief summary...">
    </div>
    <div class="form-group">
      <label>Message</label>
      <textarea id="message" class="form-control" rows="5" placeholder="Describe your issue or suggestion..."></textarea>
    </div>
    <button id="submitBtn" class="btn-submit" onclick="submitFeedback()">Submit</button>
  </div>

  <div class="history-section">
    <h3>My Previous Submissions</h3>
    <div id="historyList">
        <div class="empty-state">Loading history...</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="feedback.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js');
    });
  }
</script>


</body>
</html>
