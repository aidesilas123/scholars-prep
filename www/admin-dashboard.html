<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <link rel="icon" type="image" href="favicon1.png">
  
  <style>
    :root {
      --primary: #063b08;
      --secondary: #083502;
      --accent: #4CAF50;
      --danger: #dc3545;
      --warning: #ffc107;
      --info: #17a2b8;
      --light: #f8f9fa;
      --dark: #343a40;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
    }

    /* Admin Header */
    .admin-header {
      background: rgba(0, 0, 0, 0.3);
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(10px);
    }

    .admin-header h1 { margin: 0; font-size: 24px; }

    .logout-btn {
      background: var(--danger);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    /* Admin Container */
    .admin-container {
      display: grid;
      grid-template-columns: 250px 1fr;
      min-height: calc(100vh - 80px);
    }

    /* Sidebar */
    .admin-sidebar {
      background: rgba(0, 0, 0, 0.2);
      padding: 20px;
      border-right: 1px solid rgba(255,255,255,0.1);
    }

    .sidebar-menu { list-style: none; padding: 0; margin: 0; }
    .sidebar-menu li { margin-bottom: 10px; }

    .sidebar-menu a {
      display: block;
      padding: 15px;
      background: rgba(255,255,255,0.1);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      transition: all 0.3s;
    }

    .sidebar-menu a:hover,
    .sidebar-menu a.active {
      background: rgba(76, 175, 80, 0.3);
      transform: translateX(5px);
    }

    /* Main Content */
    .admin-main { padding: 20px; }

    .section { display: none; animation: fadeIn 0.5s; }
    .section.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Cards */
    .stats-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: rgba(255,255,255,0.1);
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .stat-card h3 { margin: 0 0 10px 0; font-size: 14px; opacity: 0.8; }
    .stat-card .number { font-size: 36px; font-weight: bold; margin: 10px 0; }

    /* Tables */
    .data-table {
      width: 100%;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 20px;
    }

    .data-table th {
      background: rgba(0,0,0,0.3);
      padding: 15px;
      text-align: left;
      font-weight: bold;
    }

    .data-table td {
      padding: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .data-table tr:hover { background: rgba(255,255,255,0.05); }

    /* Badges */
    .badge {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .badge.online { background: var(--accent); color: white; }
    .badge.offline { background: var(--danger); color: white; }
    
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s;
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: #45a049; }

    /* Loading */
    .loading {
      text-align: center;
      padding: 40px;
      color: rgba(255,255,255,0.7);
    }
  </style>
</head>
<body>
  <header class="admin-header">
    <h1>📊 Admin Panel</h1>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </header>

  <div class="admin-container">
    <nav class="admin-sidebar">
      <ul class="sidebar-menu">
        <li><a href="#" onclick="showSection('dashboard')" class="active">📊 Dashboard</a></li>
        <li><a href="#" onclick="showSection('users')">👥 User Activity</a></li>
        
        <li><a href="admin-notifications.html">🔔 Send Notifications</a></li>
        <li><a href="admin-messages.html">💬 User Messages</a></li>
        <li><a href="admin-feedback.html">📝 Feedback/Complaints</a></li>
      </ul>
    </nav>

    <main class="admin-main">
      
      <section id="dashboard" class="section active">
        <h2>Dashboard Overview</h2>
        <div class="stats-cards" id="statsCards">
          <div class="loading">Loading stats...</div>
        </div>
        
        <h3>Recent User Activity</h3>
        <div class="data-table">
          <table style="width: 100%;">
            <thead>
              <tr>
                <th>User</th>
                <th>Status</th>
                <th>Last Active</th>
              </tr>
            </thead>
            <tbody id="recentActivity">
              </tbody>
          </table>
        </div>
      </section>

      <section id="users" class="section">
        <h2>All Users Activity</h2>
        <div class="data-table">
          <table style="width: 100%;">
            <thead>
              <tr>
                <th>User</th>
                <th>Status</th>
                <th>Last Active</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="usersList">
              </tbody>
          </table>
        </div>
      </section>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
    /***********************
     * SUPABASE CONFIGURATION
     ***********************/
    const supabaseUrl = 'https://xtmoolyxxylylttugjek.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0bW9vbHl4eHlseWx0dHVnamVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5ODI5MTUsImV4cCI6MjA4NTM0MjkxNX0.2ZdfheXA3EtLLoCZenNVmoHq8XDe4geFdUVHAanwNYQ';
    
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    /***********************
     * STATE
     ***********************/
    let currentUser = null;
    let users = [];

    /***********************
     * INITIALIZATION
     ***********************/
    document.addEventListener('DOMContentLoaded', async () => {
      await checkAdminAuth();
      await loadUsers(); // Load users first for mapping
      await loadDashboardStats();
      setupRealtimeUpdates();
    });

    /***********************
     * AUTHENTICATION
     ***********************/
    async function checkAdminAuth() {
      const userData = localStorage.getItem('abupq_admin_session');
      if (!userData) {
        window.location.href = 'admin-login.html';
        return;
      }
      try {
        const user = JSON.parse(userData);
        if(!user.id) throw new Error('No ID');
        currentUser = user;
        console.log('Logged in as:', user.email);
      } catch (error) {
        window.location.href = 'admin-login.html';
      }
    }

    function logout() {
      localStorage.removeItem('abupq_admin_session');
      window.location.href = 'admin-login.html';
    }

    /***********************
     * UI FUNCTIONS
     ***********************/
    function showSection(sectionId) {
      // Hide all sections
      document.querySelectorAll('.section').forEach(section => {
        section.classList.remove('active');
      });
      
      // Update sidebar active state
      document.querySelectorAll('.sidebar-menu a').forEach(item => {
        item.classList.remove('active');
      });
      
      // Show selected section
      document.getElementById(sectionId).classList.add('active');
      
      if(window.event && window.event.target) {
          window.event.target.classList.add('active');
      }
      
      // Refresh specific data
      if (sectionId === 'users') loadUsers();
      if (sectionId === 'dashboard') {
          loadDashboardStats();
          loadUsers(); // Refresh recent activity
      }
    }

    /***********************
     * DATA LOADING FUNCTIONS
     ***********************/
    
    // 1. Load Users & Activity
    async function loadUsers() {
      try {
        const { data, error } = await supabaseClient
          .from('users')
          .select('*')
          .order('last_active', { ascending: false });
        
        if (error) throw error;
        
        users = data || [];
        
        // Render Users List (Full Page)
        const usersList = document.getElementById('usersList');
        if (usersList) {
            usersList.innerHTML = users.map(user => renderUserRow(user, true)).join('');
        }

        // Render Recent Activity (Dashboard Page - limit 5)
        const recentActivity = document.getElementById('recentActivity');
        if (recentActivity) {
            recentActivity.innerHTML = users.slice(0, 5).map(user => renderUserRow(user, false)).join('');
        }
        
      } catch (error) {
        console.error('Error loading users:', error);
      }
    }

    function renderUserRow(user, includeActions) {
        const lastActive = new Date(user.last_active);
        const now = new Date();
        const minutesAgo = Math.floor((now - lastActive) / (1000 * 60));
        
        let statusText = '';
        if (minutesAgo < 5) statusText = `<span class="badge online">Online</span>`;
        else if (minutesAgo < 60) statusText = `<span class="badge offline">${minutesAgo} min ago</span>`;
        else {
            const hoursAgo = Math.floor(minutesAgo / 60);
            statusText = `<span class="badge offline">${hoursAgo} hour${hoursAgo > 1 ? 's' : ''} ago</span>`;
        }

        let html = `
            <tr>
              <td>${user.email}</td>
              <td>${statusText}</td>
              <td>${new Date(user.last_active).toLocaleString()}</td>
        `;

        if (includeActions) {
            html += `
              <td>
                <button class="btn btn-primary" onclick="viewUserDetails('${user.id}')">View Details</button>
              </td>
            `;
        }

        html += `</tr>`;
        return html;
    }

    // 2. Dashboard Stats (Still counts data for overview, but doesn't list them)
    async function loadDashboardStats() {
      try {
        // Total users
        const { count: userCount } = await supabaseClient.from('users').select('*', { count: 'exact', head: true });
        
        // Active users
        const fiveMinutesAgo = new Date(Date.now() - 5 * 60 * 1000).toISOString();
        const { count: activeCount } = await supabaseClient
          .from('users')
          .select('*', { count: 'exact', head: true })
          .gte('last_active', fiveMinutesAgo);
        
        // Unread messages
        const { count: msgCount } = await supabaseClient
          .from('messages')
          .select('*', { count: 'exact', head: true })
          .eq('receiver_id', currentUser?.id || '')
          .eq('is_read', false);
        
        // Pending feedback
        const { count: feedbackCount } = await supabaseClient
          .from('feedback')
          .select('*', { count: 'exact', head: true })
          .eq('status', 'pending');
        
        document.getElementById('statsCards').innerHTML = `
          <div class="stat-card">
            <h3>Total Users</h3>
            <div class="number">${userCount || 0}</div>
            <div>Registered users</div>
          </div>
          <div class="stat-card">
            <h3>Active Now</h3>
            <div class="number">${activeCount || 0}</div>
            <div>Online users</div>
          </div>
          <div class="stat-card">
            <h3>Unread Messages</h3>
            <div class="number">${msgCount || 0}</div>
            <div>Check Messages Page</div>
          </div>
          <div class="stat-card">
            <h3>Pending Feedback</h3>
            <div class="number">${feedbackCount || 0}</div>
            <div>Check Feedback Page</div>
          </div>
        `;
        
      } catch (error) {
        console.error('Error loading stats:', error);
      }
    }

    function viewUserDetails(userId) {
      const user = users.find(u => u.id === userId);
      if (user) {
        alert(`User: ${user.email}\nLast Active: ${new Date(user.last_active).toLocaleString()}`);
      }
    }

    /***********************
     * REALTIME UPDATES
     ***********************/
    function setupRealtimeUpdates() {
      supabaseClient
        .channel('admin-dashboard')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'users' }, () => {
          loadUsers();
          loadDashboardStats();
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, () => {
          loadDashboardStats(); // Update counters only
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'feedback' }, () => {
          loadDashboardStats(); // Update counters only
        })
        .subscribe();
    }

    // Exports
    window.showSection = showSection;
    window.logout = logout;
    window.viewUserDetails = viewUserDetails;
  </script>
</body>
</html>
