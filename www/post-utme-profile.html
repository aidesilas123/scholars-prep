<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Profile — Scholars Prep</title>
  <link rel="icon" type="image" href="favicon1.png">
  
  <script defer type="module" src="assets/ionic-core/dist/ionic/ionic.esm.js"></script>
<script defer nomodule src="assets/ionic-core/dist/ionic/ionic.js"></script>
<link rel="stylesheet" href="assets/ionic-core/css/ionic.bundle.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --ion-color-primary: #044908;
      --panel: #ffffff;
      --muted: #8f96a3;
      --page-bg: #f3f4f6;
      --table-border: rgba(128,128,128,0.2);
    }

    body.dark, body.dark-mode {
      --ion-background-color: #121212; 
      --ion-text-color: #ffffff; 
      --panel: #1e1e1e;
      --page-bg: #121212;
      --table-border: rgba(255,255,255,0.1);
    }

    body { background: var(--page-bg); font-family: Inter, sans-serif; }
    
    ion-app.hydrated { visibility: visible; opacity: 1; transition: opacity 0.3s ease; }
    
    .loading-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 9999; backdrop-filter: blur(4px); }
    .page-loading { display: flex; flex-direction: column; align-items: center; gap: 20px; background: rgba(19,1,1,0.85); padding: 40px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.12); color: white;}
    .loading-spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: var(--ion-color-primary); animation: spin 1s infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Navigation Stack */
    .view-layer { display: none; height: 100%; width: 100%; flex-direction: column; }
    .view-layer.active { display: flex; animation: slideInRight 0.3s cubic-bezier(0.25, 0.8, 0.25, 1) forwards; }
    @keyframes slideInRight { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }

    /* Profile Header Styling */
    .profile-header { display: flex; flex-direction: column; align-items: center; padding: 30px 20px; background: var(--panel); border-bottom: 1px solid var(--table-border); }
    .avatar-circle { width: 90px; height: 90px; border-radius: 50%; background: linear-gradient(135deg, var(--ion-color-primary), #10b981); color: white; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: bold; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(4,73,8,0.3); }
    .profile-name { font-size: 22px; font-weight: bold; margin: 0 0 4px 0; color: var(--ion-text-color); }
    .profile-email { font-size: 14px; color: var(--muted); margin: 0; }

    /* Cards */
    .stats-row { display: flex; gap: 12px; padding: 16px; margin-top: 10px; }
    .stat-card { flex: 1; background: var(--panel); border: 1px solid var(--table-border); border-radius: 16px; padding: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); display: flex; flex-direction: column; justify-content: center; }
    .stat-title { font-size: 13px; color: var(--muted); margin-bottom: 8px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .stat-value { font-size: 18px; font-weight: bold; color: var(--ion-text-color); }
    .stat-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
    header {
  padding-top: max(env(safe-area-inset-top), 10px);
}

    .text-green { color: #10b981; }
    .text-red { color: #ef4444; }
    /* Custom Modal */
    .overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.7); z-index: 10000; backdrop-filter: blur(4px); }
    .custom-modal { background: var(--panel); border-radius: 14px; padding: 24px; width: min(92vw, 400px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .custom-modal h3 { margin: 0 0 12px; font-weight: bold; font-size: 20px; color: var(--ion-text-color); }
    .custom-modal p { margin: 0 0 24px; color: var(--muted); line-height: 1.6; font-size: 15px; }
    .custom-modal .row { display: flex; justify-content: flex-end; gap: 12px; }

    /* Menu List */
    .menu-group { background: var(--panel); border-radius: 16px; overflow: hidden; border: 1px solid var(--table-border); margin: 16px; }
    .menu-item { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--table-border); cursor: pointer; transition: 0.2s; }
    .menu-item:last-child { border-bottom: none; }
    .menu-item:active { background: rgba(128,128,128,0.1); }
    .menu-label { font-weight: 600; font-size: 16px; color: var(--ion-text-color); flex: 1; margin-left: 12px; }
    
    .form-card { background: var(--panel); border-radius: 16px; padding: 20px; border: 1px solid var(--table-border); margin-top: 20px; }
  </style>
</head>
<body class="noselect">
  
  <div class="loading-overlay" id="globalLoading"><div class="page-loading"><div class="loading-spinner"></div><div id="loadText">Updating...</div></div></div>

  <ion-app>
    <div id="view-profile" class="view-layer active">
      <ion-header class="ion-no-border">
        <ion-toolbar>
          <ion-buttons slot="start">
            <ion-button onclick="window.location.replace('post-utme-dashboard.html')"><ion-icon name="arrow-back-outline"></ion-icon></ion-button>
          </ion-buttons>
          <ion-title>My Profile</ion-title>
        </ion-toolbar>
      </ion-header>
      
      <ion-content>
        <div class="profile-header">
            <div class="avatar-circle" id="userAvatar">?</div>
            <h2 class="profile-name" id="userName">Loading...</h2>
            <p class="profile-email" id="userEmail">Loading...</p>
        </div>

        <div id="profileSkeleton" style="padding: 16px;">
            <div style="display: flex; gap: 12px;">
                <ion-skeleton-text animated style="height: 100px; flex: 1; border-radius: 16px;"></ion-skeleton-text>
                <ion-skeleton-text animated style="height: 100px; flex: 1; border-radius: 16px;"></ion-skeleton-text>
            </div>
        </div>

        <div class="stats-row" id="profileStats" style="display: none;">
            <div class="stat-card">
                <div class="stat-title"><ion-icon name="shield-checkmark" class="text-green"></ion-icon> Subscription</div>
                <div class="stat-value" id="subStatus">Free Plan</div>
                <div class="stat-sub" id="subDates">Expires: N/A</div>
            </div>
            <div class="stat-card">
                <div class="stat-title"><ion-icon name="flame" style="color: #f97316;"></ion-icon> Study Streak</div>
                <div class="stat-value" id="studyStreak">0 Days</div>
                <div class="stat-sub">Keep practicing!</div>
            </div>
        </div>

        <div class="menu-group">
            <div class="menu-item" onclick="switchView('view-password')">
                <ion-icon name="lock-closed-outline" color="primary" style="font-size: 22px;"></ion-icon>
                <div class="menu-label">Change Password</div>
                <ion-icon name="chevron-forward" color="medium"></ion-icon>
            </div>
            <div class="menu-item" onclick="logoutUser()">
                <ion-icon name="log-out-outline" color="danger" style="font-size: 22px;"></ion-icon>
                <div class="menu-label" style="color: var(--ion-color-danger);">Log Out</div>
            </div>
        </div>
      </ion-content>
    </div>

    <div id="view-password" class="view-layer">
      <ion-header class="ion-no-border">
        <ion-toolbar>
          <ion-buttons slot="start">
            <ion-button onclick="history.back()"><ion-icon name="arrow-back-outline"></ion-icon></ion-button>
          </ion-buttons>
          <ion-title>Security</ion-title>
        </ion-toolbar>
      </ion-header>
      
      <ion-content class="ion-padding">
        <div class="form-card">
            <h2 style="margin-top: 0; color: var(--ion-text-color);">Update Password</h2>
            <p style="color: var(--muted); font-size: 14px; margin-bottom: 20px;">Enter a new, strong password below.</p>
            
            <ion-item fill="outline" style="--border-radius: 8px; margin-bottom: 15px; --background: transparent;">
                <ion-label position="stacked">New Password</ion-label>
                <ion-input type="password" id="newPassword" placeholder="Minimum 6 characters"></ion-input>
            </ion-item>

            <ion-button expand="block" color="primary" style="--border-radius: 10px; height: 50px; font-weight: bold;" onclick="changePassword()">
                Save Password
            </ion-button>
        </div>
      </ion-content>
    </div>
    <div class="overlay" id="overlay">
    <div class="custom-modal">
      <h3 id="modalTitle">Confirm</h3>
      <p id="modalMsg">Are you sure?</p>
      <div class="row">
        <ion-button fill="outline" color="medium" id="modalCancel" onclick="hideModal()">Cancel</ion-button>
        <ion-button color="primary" id="modalOk">Yes</ion-button>
      </div>
    </div>
  </div>

  </ion-app>


  <script defer src="post-utme-profile.js"></script>
</body>
</html>
